id: ch05
title: "5장 · 파일을 나눈다"
goal: "한 파일에 뒤엉킨 코드를 모듈로 갈라내고, 필요한 것만 골라 가져다 쓴다"
intro: |
  `app.mjs` 를 위에서 아래로 읽어 보라. 세 가지가 한 덩어리로 뒤엉켜 있다.

    할 일 데이터를 다루는 일   push · find · filter
    화면에 보여 주는 일        formatTask · render · printAll
    명령을 해석하는 일         process.argv 와 if 사슬

  지금은 70줄이라 참을 만하다. 그런데 6장에서 입력 검증이 붙고, 7장에서 파일 저장이 붙고,
  8장에서 클래스가 들어오면 이 파일은 손댈 수 없는 덩어리가 된다.

  나누는 기준은 '줄 수'가 아니다. **같이 바뀌는 것끼리 모으고, 따로 바뀌는 것은 떼어 낸다.**
  할 일을 담는 방식이 바뀔 때 화면 문구까지 흔들려서는 안 된다.

  자바스크립트는 파일 하나가 곧 하나의 **모듈** 이다. 파일 안의 것은 기본적으로 그 파일 소유이고,
  내보내겠다고 표시한 것만 밖에서 보인다. 이 장에서 그 경계를 손으로 그어 본다.

steps:
  - id: ch05-s01
    concept: export-named
    kind: edit
    goal: "할 일을 추가하는 함수를 별도 모듈로 내보낸다"
    teach: |
      `workspace/lib/tasks.mjs` 파일을 새로 만든다. 폴더 `lib` 도 함께 만든다.
      앞으로 '할 일 데이터를 다루는 일'은 전부 이 파일이 맡는다.

      밖에서 쓸 수 있게 하려면 선언 앞에 `export` 를 붙인다. 이것을 **이름 붙은 내보내기** 라고 한다.

        export function addTask(tasks, title) {
          tasks.push({ title: title, done: false })
          return tasks[tasks.length - 1]
        }

      두 가지를 눈여겨본다.

      **목록을 인자로 받는다.** 파일 안에 목록을 두지 않고 넘겨받는다. 그래야 이 함수가
      '어떤 목록이든' 다룰 수 있고, 나중에 테스트할 때도 빈 배열을 만들어 넣어 볼 수 있다.

      **넣은 것을 돌려준다.** 부른 쪽이 방금 넣은 항목을 다시 찾을 필요가 없어진다.

      아직 `app.mjs` 는 고치지 않는다. 모듈 파일만 만든다. 가져다 쓰는 것은 다음 스텝이다.
    fade:
      copy: |
        export function addTask(tasks, title) {
          tasks.push({ title: title, done: false })
          return tasks[tasks.length - 1]
        }
      fill: |
        ____ function addTask(tasks, title) {
          tasks.push({ title: title, done: false })
          ____ tasks[tasks.length - 1]
        }
      recall: "workspace/lib/tasks.mjs 를 만들고, 목록과 제목을 받아 새 할 일을 넣은 뒤 그것을 돌려주는 함수를 내보낸다"
    hints:
      - "파일 안에 적었다고 밖에서 보이는 것이 아니다. 내보내겠다는 표시가 필요하다."
      - "lib 폴더 안에 tasks.mjs 를 만들고, 함수 선언 앞에 내보내기 키워드를 붙인다."
      - "export function addTask(tasks, title) { tasks.push({ title: title, done: false }); return tasks[tasks.length - 1] } 를 적는다."
    verify:
      - type: fs
        label: "lib/tasks.mjs 에서 addTask 를 내보낸다"
        path: "lib/tasks.mjs"
        matches: ['export\s+(function\s+addTask|const\s+addTask)']
      - type: cmd
        label: "addTask 가 목록에 넣고, 넣은 것을 돌려준다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = []
            const added = addTask(tasks, '우유 사기')

            assert.equal(tasks.length, 1, '넘겨준 목록에 들어가지 않았다')
            assert.equal(tasks[0].title, '우유 사기', '제목이 그대로 담겨야 한다')
            assert.equal(tasks[0].done, false, '새 할 일은 아직 안 끝난 상태여야 한다')
            assert.equal(added, tasks[0], '넣은 그 항목을 돌려줘야 한다')
      - type: cmd
        label: "어떤 목록에도, 어떤 제목에도 통한다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = [{ title: '빨래 개기', done: true }]
            addTask(tasks, '설거지')
            addTask(tasks, '세차하기')

            assert.equal(tasks.length, 3, '이미 담긴 것이 있어도 뒤에 붙어야 한다')
            assert.deepEqual(
              tasks.map((task) => task.title),
              ['빨래 개기', '설거지', '세차하기'],
              '넣은 순서대로 뒤에 쌓여야 한다',
            )
    review_card:
      front: "모듈 안의 함수를 밖에서 쓸 수 있게 하려면?"
      back: "선언 앞에 export 를 붙인다"
      answer_pattern: "export|내보내"

  - id: ch05-s02
    concept: import-statement
    kind: edit
    goal: "app.mjs 가 그 모듈을 가져다 쓴다"
    teach: |
      내보낸 것을 가져올 때는 `import` 를 쓴다. 파일 **맨 위** 에 적는다.

        import { addTask } from './lib/tasks.mjs'

      세 가지를 지킨다.

        중괄호      내보낸 이름을 골라 담는다. 여러 개면 쉼표로 나열한다
        './'        내 파일 기준의 경로임을 밝힌다. 빼면 설치된 패키지를 찾는다
        '.mjs'      확장자를 끝까지 적는다. 브라우저와 같은 규칙이라 생략할 수 없다

      이제 `add` 가지에서 직접 `push` 하지 말고 가져온 함수를 쓴다.

        if (command === 'add' && title) {
          const added = addTask(tasks, title)
          console.log(`추가: ${render(added)}`)
          printAll(tasks)
        }

      `tasks[tasks.length - 1]` 로 방금 넣은 것을 도로 찾던 줄이 사라진다.
      `addTask` 가 이미 돌려주기 때문이다.

      **`app.mjs` 안에 `push` 가 한 번도 남지 않아야 한다.** 목록을 어떻게 담는지는
      이제 `lib/tasks.mjs` 만 아는 일이다.
    predict:
      question: "`import { addTask } from './lib/tasks'` 처럼 확장자를 빼면 어떻게 될까?"
      answer_pattern: "오류|에러|error|못 ?찾|실패|안 ?된"
      reveal: |
        모듈을 찾지 못해 오류가 난다. 번들러를 쓰는 환경에서는 생략이 되기도 해서 헷갈리지만,
        Node가 그대로 실행하는 ESM에서는 브라우저와 같은 규칙이 적용된다 — 경로를 끝까지 적어야 한다.
        './' 를 빼도 문제가 된다. 그때는 설치된 패키지 이름으로 알아듣고 node_modules 를 뒤진다.
    fade:
      copy: |
        import { addTask } from './lib/tasks.mjs'

        const added = addTask(tasks, title)
        console.log(`추가: ${render(added)}`)
      fill: |
        ____ ____ addTask ____ from './lib/tasks.mjs'

        const added = addTask(tasks, title)
        console.log(`추가: ${render(added)}`)
      recall: "app.mjs 맨 위에서 addTask 를 가져오고, add 가지가 직접 push 하는 대신 그 함수를 쓰게 한다"
    hints:
      - "app.mjs 가 아직 목록을 어떻게 담는지 알고 있다. 그 지식을 모듈로 넘겨야 한다."
      - "파일 맨 위에 가져오기 한 줄을 적고, add 가지의 push 와 되찾는 줄을 함수 호출 하나로 바꾼다."
      - "import { addTask } from './lib/tasks.mjs' 를 맨 위에 적고, const added = addTask(tasks, title) 로 바꾼 뒤 render(added) 를 찍는다."
    verify:
      - type: fs
        label: "app.mjs 가 addTask 를 가져온다"
        path: "app.mjs"
        matches: ["import\\s*\\{[^}]*addTask[^}]*\\}\\s*from\\s*['\"]\\./lib/tasks\\.mjs['\"]"]
      - type: fs
        label: "app.mjs 는 더 이상 직접 목록에 넣지 않는다"
        path: "app.mjs"
        not_matches: ['\.push\(']
      - type: cmd
        label: "추가는 그대로 동작한다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '3\. \[ \] 장보기'
      - type: cmd
        label: "다른 제목을 줘도 마찬가지다"
        run: ["node", "app.mjs", "add", "설거지"]
        expect_output: '3\. \[ \] 설거지'
        reject_output: '장보기'
    review_card:
      front: "내 파일 옆의 모듈을 가져올 때 경로에서 빠뜨리면 안 되는 두 가지는?"
      back: "앞의 './' 와 끝의 확장자 '.mjs'"
      answer_pattern: "확장자|\\.mjs|\\./|점"

  - id: ch05-s03
    concept: default-export
    kind: edit
    goal: "표시 함수를 대표 내보내기로 가진 모듈로 분리한다"
    teach: |
      이번에는 '화면에 보여 주는 일'을 떼어 낸다. `workspace/lib/format.mjs` 를 만든다.

      모듈이 **대표하는 것 하나** 를 내보낼 때는 `export default` 를 쓴다. 이름 없이 내보낸다.

        export default function formatTask(title, done = false) {
          if (done) {
            return `[x] ${title}`
          } else {
            return `[ ] ${title}`
          }
        }

      가져올 때는 중괄호가 없다. 그리고 **이름을 내가 정한다.**

        import formatTask from './lib/format.mjs'

      이름을 마음대로 붙일 수 있다는 것은 편해 보이지만 대가가 있다.
      같은 것을 누구는 `formatTask`, 누구는 `fmt` 로 부르게 되어 코드를 검색하기 어려워진다.
      그래서 **기본은 이름 붙은 내보내기(`export`)** 이고, 모듈에 대표가 뚜렷할 때만 `default` 를 쓴다.
      이 도장의 `lib/tasks.mjs` 가 이름 붙은 쪽인 이유가 그것이다 — 대표가 없고 여럿이 나란하다.

      `app.mjs` 에서 `formatTask` 선언을 **지우고** 가져오기로 바꾼다. `render` 와 `printAll` 은
      그대로 `app.mjs` 에 남긴다 — 그 둘은 '무엇을 어떻게 늘어놓을지'라서 화면 조립에 가깝다.
    fade:
      copy: |
        export default function formatTask(title, done = false) {
          if (done) {
            return `[x] ${title}`
          } else {
            return `[ ] ${title}`
          }
        }
      fill: |
        export ____ function formatTask(title, done = false) {
          if (done) {
            return `[x] ${title}`
          } else {
            return `[ ] ${title}`
          }
        }
      recall: "lib/format.mjs 를 만들어 formatTask 를 대표로 내보내고, app.mjs 는 선언을 지우고 그것을 가져오게 한다"
    hints:
      - "모듈이 내놓는 것이 사실상 하나뿐이라면, 이름을 붙여 내보내지 않는 방법이 있다."
      - "lib/format.mjs 로 formatTask 를 옮기고 대표로 내보낸 뒤, app.mjs 에서는 선언을 지우고 중괄호 없이 가져온다."
      - "export default function formatTask(...) 로 옮기고, app.mjs 맨 위에 import formatTask from './lib/format.mjs' 를 적는다."
    verify:
      - type: fs
        label: "lib/format.mjs 가 대표 내보내기를 갖는다"
        path: "lib/format.mjs"
        matches: ['export\s+default']
      - type: fs
        label: "app.mjs 는 formatTask 를 직접 선언하지 않는다"
        path: "app.mjs"
        matches: ["import\\s+\\w+\\s+from\\s*['\"]\\./lib/format\\.mjs['\"]"]
        not_matches: ['function\s+formatTask']
      - type: cmd
        label: "대표 내보내기는 중괄호 없이 가져와 쓸 수 있다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import format from './lib/format.mjs'
            import assert from 'node:assert/strict'

            assert.equal(format('우유 사기'), '[ ] 우유 사기', '완료 여부를 생략하면 아직 안 한 모양이어야 한다')
            assert.equal(format('빨래 개기', true), '[x] 빨래 개기', '끝낸 것은 [x] 모양이어야 한다')
            assert.equal(format('세차하기', false), '[ ] 세차하기', '아직인 것은 [ ] 모양이어야 한다')
      - type: cmd
        label: "CLI 는 그대로 동작한다"
        run: ["node", "app.mjs", "list"]
        expect_output: '1\. \[ \] 우유 사기[\s\S]*2\. \[x\] 빨래 개기'
    review_card:
      front: "export default 로 내보낸 것을 가져올 때와 이름 붙은 export 를 가져올 때의 차이는?"
      back: "default 는 중괄호 없이 가져오고 이름을 내가 정한다. 이름 붙은 것은 중괄호 안에 그 이름 그대로 적는다"
      answer_pattern: "중괄호|이름"
    explain:
      question: "가져오는 쪽이 이름을 마음대로 정할 수 있는 것이 왜 꼭 좋은 일만은 아닐까?"
      model_answer: |
        같은 것이 파일마다 다른 이름으로 불리게 된다. 그러면 'formatTask 를 쓰는 곳을 전부 찾아라'
        같은 일이 불가능해진다 — 검색어가 하나로 정해지지 않기 때문이다. 이름 붙은 내보내기는
        가져오는 쪽에도 같은 이름을 강제해서, 코드 전체에서 한 낱말로 추적할 수 있게 해 준다.
        자유도가 낮은 쪽이 큰 코드에서는 오히려 편하다.
      keywords:
        - term: "이름"
          nudge: "같은 함수가 파일마다 다르게 불릴 때 무엇이 어려워지는지 떠올려 본다."
        - term: "찾"
          nudge: "코드에서 무언가를 추적할 때 무엇에 기대는지 생각해 본다."

  - id: ch05-s04
    concept: module-scope
    kind: edit
    goal: "모듈 안에만 두는 도우미를 만들고, 완료·집계 기능을 넓힌다"
    teach: |
      모듈 안에 적었다고 다 밖으로 나가는 것이 아니다. **`export` 를 붙인 것만 나간다.**
      나머지는 그 파일 안에서만 쓰이는 내부 사정이다. 이것을 모듈 스코프라고 한다.

      `lib/tasks.mjs` 에 두 기능을 더한다. 그리고 둘이 함께 쓰는 작은 도우미를 하나 두되,
      **그것은 내보내지 않는다.**

        const isPending = (task) => task.done === false

        export function addTask(tasks, title) {
          ...
        }

        export function completeTask(tasks, title) {
          const target = tasks.find((task) => task.title === title)
          if (target) {
            target.done = true
          }
          return target
        }

        export function countPending(tasks) {
          return tasks.filter(isPending).length
        }

      `completeTask` 는 찾은 것을 돌려주고, 못 찾으면 `undefined` 를 돌려준다.
      **못 찾았을 때 무엇을 할지는 부르는 쪽이 정한다** — CLI라면 종료 코드로 알리겠지만,
      다른 데서 쓴다면 다르게 처리할 수도 있다. 모듈은 판단하지 않고 사실만 돌려준다.

      `isPending` 을 내보내지 않는 것이 핵심이다. 이 이름은 언제든 바꾸거나 없앨 수 있어야 한다.
      밖으로 내보내는 순간 그것도 약속이 되어 함부로 못 고친다.
      **내보내는 것은 최소로 둔다.**

      이번에도 `app.mjs` 는 아직 고치지 않는다. 다음 스텝에서 한 번에 정리한다.
    fade:
      copy: |
        const isPending = (task) => task.done === false

        export function completeTask(tasks, title) {
          const target = tasks.find((task) => task.title === title)
          if (target) {
            target.done = true
          }
          return target
        }

        export function countPending(tasks) {
          return tasks.filter(isPending).length
        }
      fill: |
        ____ isPending = (task) => task.done === false

        export function completeTask(tasks, title) {
          const target = tasks.find((task) => task.title === title)
          if (target) {
            target.done = true
          }
          ____ target
        }

        export function countPending(tasks) {
          return tasks.____(isPending).length
        }
      recall: "lib/tasks.mjs 에 완료 처리와 남은 개수 세기를 더하고, 둘이 함께 쓰는 도우미는 내보내지 않는다"
    hints:
      - "모듈 밖으로 내보낸 이름은 함부로 바꿀 수 없는 약속이 된다. 내부 사정은 내부에 둔다."
      - "lib/tasks.mjs 에 completeTask 와 countPending 을 내보내고, 두 곳에서 쓰는 조건은 export 없이 선언한다."
      - "const isPending = (task) => task.done === false 를 export 없이 두고, completeTask 는 find 로 찾아 done 을 바꾼 뒤 돌려주고, countPending 은 filter(isPending).length 를 돌려준다."
    verify:
      - type: fs
        label: "내보내지 않는 도우미가 있다"
        path: "lib/tasks.mjs"
        # export 가 앞에 붙지 않은 최상위 선언. 화살표든 function 선언이든 인정한다.
        matches: ['(^|\n)(const|let|function)\s+\w+']
      - type: cmd
        label: "completeTask 는 지목한 것만 완료하고 그것을 돌려준다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { completeTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = [
              { title: '우유 사기', done: false },
              { title: '빨래 개기', done: false },
            ]
            const target = completeTask(tasks, '빨래 개기')

            assert.equal(tasks[1].done, true, '지목한 할 일이 완료되어야 한다')
            assert.equal(tasks[0].done, false, '지목하지 않은 것은 건드리면 안 된다')
            assert.equal(target, tasks[1], '완료한 그 항목을 돌려줘야 한다')
      - type: cmd
        label: "없는 제목이면 undefined 를 돌려준다 — 판단은 부르는 쪽이 한다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { completeTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = [{ title: '우유 사기', done: false }]
            const target = completeTask(tasks, '세차하기')

            assert.equal(target, undefined, '못 찾았으면 undefined 를 돌려줘야 한다')
            assert.equal(tasks[0].done, false, '못 찾았는데 엉뚱한 것을 완료하면 안 된다')
      - type: cmd
        label: "countPending 은 아직 안 끝난 것만 센다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { countPending } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            assert.equal(countPending([]), 0, '빈 목록은 0이다')
            assert.equal(
              countPending([
                { title: 'a', done: false },
                { title: 'b', done: true },
                { title: 'c', done: false },
              ]),
              2,
              '끝난 것을 빼고 세야 한다',
            )
            assert.equal(
              countPending([{ title: 'a', done: true }]),
              0,
              '전부 끝났으면 0이다',
            )
      - type: cmd
        label: "내보내지 않은 도우미는 밖에서 가져올 수 없다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { isPending } from './lib/tasks.mjs'
            console.log('내부 도우미가 밖으로 새어 나갔다')
        expect_exit: 1
    review_card:
      front: "모듈 안에 선언했지만 export 하지 않은 이름은 밖에서 어떻게 되는가?"
      back: "보이지 않는다. 가져오려 하면 오류가 난다"
      answer_pattern: "안 ?보|없|못|오류|에러"

  - id: ch05-s05
    concept: task-module
    kind: edit
    boss: true
    goal: "app.mjs 에 명령 해석만 남기고 나머지를 모듈로 넘긴다"
    teach: |
      마무리다. 힌트는 없다.

      `app.mjs` 는 이제 **명령을 해석하고 결과를 찍는 일** 만 한다.
      할 일 데이터를 어떻게 담고 찾고 세는지는 `lib/tasks.mjs` 가, 한 줄을 어떤 모양으로 쓰는지는
      `lib/format.mjs` 가 안다.

      조건은 하나로 요약된다 — **`app.mjs` 안에 `push`·`find`·`filter` 가 한 번도 나오지 않는다.**
      그 세 낱말이 남아 있다면 데이터를 다루는 일이 아직 새어 나와 있다는 뜻이다.

      요구사항은 넷이다.

        1. lib/tasks.mjs 에서 addTask · completeTask · countPending 셋을 가져온다
        2. add 는 addTask 로 넣고, 추가한 줄과 번호 붙은 전체 목록을 찍는다
        3. done 은 completeTask 로 처리한다. 돌려받은 것이 없으면(못 찾았으면)
           '그런 할 일이 없다' 를 알리고 종료 코드 1로 끝낸다
        4. list 는 countPending 으로 남은 개수를 세어 전체 개수와 함께 알리고 목록을 찍는다

      화면에 나오는 것은 4장 마지막과 **한 글자도 다르지 않아야 한다.**
      겉이 그대로인데 속이 정리되는 것 — 그것이 리팩터링이다.
      9장에서 테스트를 배우고 나면, 이 '겉이 그대로임'을 사람 눈이 아니라 테스트가 지켜 주게 된다.
    verify:
      - type: fs
        label: "app.mjs 에 데이터 조작이 남아 있지 않다"
        path: "app.mjs"
        not_matches: ['\.push\(', '\.find\(', '\.filter\(']
      - type: fs
        label: "세 기능을 모두 모듈에서 가져온다"
        path: "app.mjs"
        matches: ['addTask', 'completeTask', 'countPending']
      - type: cmd
        label: "add 는 넣은 뒤의 전체 목록을 보여 준다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '3\. \[ \] 장보기'
      - type: cmd
        label: "다른 제목을 줘도 그것이 목록에 들어간다"
        run: ["node", "app.mjs", "add", "설거지"]
        expect_output: '3\. \[ \] 설거지'
        reject_output: '장보기'
      - type: cmd
        label: "done 은 지목한 것만 완료하고 바뀐 목록을 보여 준다"
        run: ["node", "app.mjs", "done", "빨래 개기"]
        expect_output: '1\. \[ \] 우유 사기[\s\S]*2\. \[x\] 빨래 개기'
      - type: cmd
        label: "다른 제목을 지목하면 그쪽이 완료된다"
        run: ["node", "app.mjs", "done", "우유 사기"]
        expect_output: '1\. \[x\] 우유 사기'
      - type: cmd
        label: "없는 제목은 알리고 실패로 끝낸다"
        run: ["node", "app.mjs", "done", "세차하기"]
        expect_exit: 1
        expect_output: '그런 할 일이 없다'
      - type: cmd
        label: "list 는 남은 개수를 함께 알린다"
        run: ["node", "app.mjs", "list"]
        expect_output: '할 일 2개 \(남은 것 1개\)'
      - type: cmd
        label: "명령이 없으면 사용법을 알리고 실패로 끝낸다"
        run: ["node", "app.mjs"]
        expect_exit: 1
        expect_output: '사용법'
    review_card:
      front: "모듈을 나누는 기준은 '파일이 길어서'가 아니다. 무엇인가?"
      back: "같이 바뀌는 것끼리 모으고, 따로 바뀌는 것은 떼어 낸다"
      answer_pattern: "같이|함께|바뀌|변경|책임"
    explain:
      question: "이 스텝에서 화면 출력은 한 글자도 바뀌지 않았다. 그런데도 무엇이 나아졌나?"
      model_answer: |
        고칠 곳이 좁아졌다. 할 일을 담는 방식을 바꾸고 싶으면 이제 lib/tasks.mjs 만 열면 되고,
        화면 문구를 바꾸고 싶으면 lib/format.mjs 만 열면 된다. 전에는 어느 쪽을 고쳐도 같은 파일을
        헤집어야 했고, 그러다 상관없는 부분을 건드릴 위험이 있었다.
        또 하나 — 이제 각 부분을 따로 불러내 확인할 수 있다. app.mjs 전체를 실행하지 않고
        addTask 하나만 가져와 시험해 볼 수 있다는 것이 9장에서 결정적으로 쓰인다.
      keywords:
        - term: "고칠"
          nudge: "무언가를 바꾸고 싶을 때 열어야 하는 파일이 몇 개인지 세어 본다."
        - term: "따로"
          nudge: "부분만 떼어 내 확인할 수 있게 된 점을 짚어 본다."
