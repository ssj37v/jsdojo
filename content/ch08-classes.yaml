id: ch08
title: "8장 · 틀을 만든다"
goal: "흩어진 목록과 함수를 하나의 틀로 묶고, 밖에서 손댈 수 없게 감춘다"
intro: |
  `lib/tasks.mjs` 의 함수들을 나란히 놓고 보라.

    addTask(tasks, title)
    completeTask(tasks, title)
    countPending(tasks)

  셋 다 첫 인자가 `tasks` 다. 언제나. 그리고 `app.mjs` 는 그 배열을 손에 들고 다니며
  함수를 부를 때마다 꼬박꼬박 넘긴다. **늘 함께 다니는 것이 따로 떨어져 있다는 신호다.**

  더 큰 문제가 있다. 목록이 그냥 배열이라 아무나 `tasks.push({ 아무거나 })` 할 수 있다.
  6장에서 공들여 세운 검사가 **함수를 거치지 않으면 통째로 우회된다.**

  상태와 그 상태를 다루는 함수를 한 틀에 묶고, 안쪽은 감춘다. 그것이 클래스다.
  이 장이 끝나면 `store.add('우유 사기')` 한 줄이 되고, `store.tasks` 로는 아무것도 못 만진다.

steps:
  - id: ch08-s01
    concept: class-syntax
    kind: edit
    goal: "목록을 지닌 틀을 만들고 그것으로 물건을 찍어 낸다"
    teach: |
      `workspace/lib/task-store.mjs` 를 새로 만든다.

      **클래스는 틀이다.** 틀 자체는 물건이 아니고, `new` 로 찍어 내야 물건(인스턴스)이 나온다.

        export class TaskStore {
          tasks = []

          all() {
            return this.tasks
          }
        }

      세 가지를 짚는다.

      **`tasks = []`** 는 필드다. 찍어 낸 물건마다 하나씩 생긴다.
      틀에 하나 있는 것이 아니라 **인스턴스마다 따로** 생긴다는 것이 핵심이다.

      **`all()`** 은 메서드다. 함수인데 `function` 을 적지 않는다. 클래스 안에서는 그 자리가 곧 함수다.

      **`this`** 는 '지금 이 메서드를 부른 그 물건'이다. `this.tasks` 는 이 인스턴스의 목록이다.
      그래서 두 개를 찍어 내면 서로 다른 목록을 갖는다.

        const a = new TaskStore()
        const b = new TaskStore()
        a.tasks.push({ title: '우유 사기', done: false })
        b.all()   → []   a 에 넣은 것은 b 에 없다

      이것이 모듈 최상위에 배열 하나를 두는 것과의 결정적 차이다.
      모듈 변수는 온 프로그램에 하나뿐이라 시험하기도, 여러 목록을 다루기도 어렵다.

      클래스 이름은 첫 글자를 대문자로 쓴다. 틀이라는 표시다.
      아직 `app.mjs` 는 고치지 않는다.
    predict:
      question: "`new TaskStore()` 를 두 번 하면 두 목록은 같은 배열일까, 서로 다른 배열일까?"
      answer_pattern: "다른|따로|별|각|아니"
      reveal: |
        서로 다르다. 필드는 인스턴스가 만들어질 때마다 새로 만들어진다.
        만약 모듈 최상위에 `const tasks = []` 를 두고 그것을 썼다면 온 프로그램이 하나를 나눠 쓰게 되어,
        시험용 목록 하나 만들려 해도 진짜 목록이 오염된다. 틀로 찍어 내는 방식이 그 문제를 없앤다.
    fade:
      copy: |
        export class TaskStore {
          tasks = []

          all() {
            return this.tasks
          }
        }
      fill: |
        export ____ TaskStore {
          tasks = []

          all() {
            return ____.tasks
          }
        }
      recall: "lib/task-store.mjs 에 목록을 지닌 틀을 만들고, 그 목록을 돌려주는 메서드를 둔다"
    hints:
      - "함수마다 같은 배열을 넘기고 있다면, 그 배열과 함수들이 한 덩어리여야 한다는 뜻이다."
      - "lib/task-store.mjs 에 클래스를 내보내고, 안에 목록 필드와 그것을 돌려주는 메서드를 둔다."
      - "export class TaskStore { tasks = []  all() { return this.tasks } } 를 적는다."
    verify:
      - type: fs
        label: "lib/task-store.mjs 가 틀을 내보낸다"
        path: "lib/task-store.mjs"
        matches: ['export\s+class\s+TaskStore']
      - type: cmd
        label: "찍어 낸 물건마다 자기 목록을 갖는다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const a = new TaskStore()
            const b = new TaskStore()

            assert.deepEqual(a.all(), [], '처음에는 빈 목록이어야 한다')

            a.all().push({ title: '우유 사기', done: false })

            assert.equal(a.all().length, 1, 'a 의 목록에는 들어가야 한다')
            assert.deepEqual(
              b.all(),
              [],
              'b 까지 함께 늘어났다면 목록을 모두가 나눠 쓰고 있는 것이다 (모듈 최상위 배열)',
            )
    review_card:
      front: "클래스와 인스턴스의 관계를 한마디로 하면?"
      back: "클래스는 틀, new 로 찍어 낸 것이 인스턴스. 필드는 인스턴스마다 따로 생긴다"
      answer_pattern: "틀|new|인스턴스|찍"

  - id: ch08-s02
    concept: constructor
    kind: edit
    goal: "이미 있는 목록을 받아 시작할 수 있게 한다"
    teach: |
      지금은 항상 빈 목록으로만 시작한다. 그런데 7장에서 파일에 저장해 두지 않았나.
      **읽어 온 목록을 들고 시작** 할 수 있어야 쓸모가 있다.

      찍어 낼 때 한 번 불리는 특별한 메서드가 있다. 이름이 정해져 있다 — `constructor` 다.

        export class TaskStore {
          tasks

          constructor(tasks = []) {
            this.tasks = tasks
          }

          all() {
            return this.tasks
          }
        }

      `new TaskStore(불러온목록)` 이라고 하면 그 값이 `constructor` 의 인자로 들어온다.
      2장에서 배운 기본값을 여기에도 쓴다 — 아무것도 주지 않으면 빈 목록이다.

        new TaskStore()                    → 빈 목록으로 시작
        new TaskStore(await readTasks())   → 파일에서 읽은 것으로 시작

      필드를 `tasks = []` 에서 `tasks` 로 바꾼 것을 눈여겨본다.
      초기값은 이제 `constructor` 가 정하므로, 필드 선언은 '이 틀에는 tasks 라는 것이 있다'는
      표시만 남긴다. 선언을 아예 지워도 돌아가지만, 남겨 두면 무엇을 가진 틀인지 위에서 바로 읽힌다.
    fade:
      copy: |
        export class TaskStore {
          tasks

          constructor(tasks = []) {
            this.tasks = tasks
          }
        }
      fill: |
        export class TaskStore {
          tasks

          ____(tasks = ____) {
            this.tasks = tasks
          }
        }
      recall: "찍어 낼 때 목록을 받아 시작할 수 있게 하고, 주지 않으면 빈 목록이 되게 한다"
    hints:
      - "파일에서 읽어 온 목록을 들고 시작할 방법이 없다. 찍어 낼 때 건네받을 자리가 필요하다."
      - "클래스 안에 찍어 낼 때 한 번 불리는 특별한 이름의 메서드를 두고, 받은 값을 필드에 담는다."
      - "constructor(tasks = []) { this.tasks = tasks } 를 두고, 필드 선언은 tasks 만 남긴다."
    verify:
      - type: cmd
        label: "받은 목록을 들고 시작한다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const loaded = [
              { title: '우유 사기', done: false },
              { title: '빨래 개기', done: true },
            ]
            const store = new TaskStore(loaded)

            assert.deepEqual(store.all(), loaded, '넘겨준 목록을 그대로 들고 있어야 한다')
      - type: cmd
        label: "아무것도 주지 않으면 빈 목록으로 시작한다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            assert.deepEqual(new TaskStore().all(), [], '기본값이 없으면 첫 사용자가 시작할 수 없다')
      - type: cmd
        label: "서로 다른 목록으로 여럿을 찍어 낼 수 있다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const a = new TaskStore([{ title: '장보기', done: false }])
            const b = new TaskStore([{ title: '설거지', done: true }])

            assert.equal(a.all()[0].title, '장보기')
            assert.equal(b.all()[0].title, '설거지')
            assert.equal(a.all().length, 1, '서로 섞이면 안 된다')
    review_card:
      front: "new 로 찍어 낼 때 딱 한 번 불리는 메서드의 이름은?"
      back: "constructor"
      answer_pattern: "constructor|생성자"

  - id: ch08-s03
    concept: method
    kind: edit
    goal: "목록을 넘기지 않고도 추가하고 완료할 수 있게 한다"
    teach: |
      이제 본론이다. `addTask(tasks, title)` 에서 `tasks` 를 없앤다.
      틀이 이미 목록을 들고 있으니 다시 건넬 이유가 없다.

        import { addTask, completeTask } from './tasks.mjs'

        export class TaskStore {
          ...

          add(title) {
            return addTask(this.tasks, title)
          }

          complete(title) {
            return completeTask(this.tasks, title)
          }
        }

      **기존 함수를 지우지 않는다.** 클래스는 그 위에 서는 얇은 껍질이다.
      검사와 규칙은 이미 `lib/tasks.mjs` 안에 있고, 잘 돌고 있다. 옮겨 적으면 그 규칙을
      두 벌 갖게 되어 언젠가 어긋난다. **껍질은 목록을 건네는 일만 한다.**

      그래서 6장의 검사도 그대로 따라온다 — `store.add('')` 는 여전히 던진다.
      규칙을 다시 쓰지 않았는데 그대로 지켜지는 것, 그것이 얇은 껍질의 값어치다.

        const store = new TaskStore()
        store.add('우유 사기')     → 목록에 들어간다
        store.add('')              → InvalidInputError 를 던진다
        store.complete('우유 사기') → 그 항목을 완료로 바꿔 돌려준다
        store.complete('없는 것')   → undefined (찾지 못한 것은 실패가 아니다)
    fade:
      copy: |
        add(title) {
          return addTask(this.tasks, title)
        }

        complete(title) {
          return completeTask(this.tasks, title)
        }
      fill: |
        add(title) {
          return addTask(____.tasks, title)
        }

        complete(title) {
          return ____(this.tasks, title)
        }
      recall: "목록을 넘기지 않고 제목만으로 추가·완료할 수 있는 메서드를 두되, 규칙은 기존 함수에 맡긴다"
    hints:
      - "틀이 이미 목록을 들고 있다. 부르는 쪽이 그것을 다시 건넬 이유가 없다."
      - "클래스 안에서 기존 함수를 부르고, 목록 자리에는 this 의 것을 넣는다. 검사 규칙은 옮겨 적지 않는다."
      - "add(title) { return addTask(this.tasks, title) } 와 complete(title) { return completeTask(this.tasks, title) } 를 둔다."
    verify:
      - type: cmd
        label: "목록을 넘기지 않고 추가할 수 있다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore()
            const added = store.add('우유 사기')

            assert.equal(store.all().length, 1, '목록에 들어가야 한다')
            assert.equal(store.all()[0].title, '우유 사기')
            assert.equal(store.all()[0].done, false, '새 할 일은 아직 안 끝난 상태여야 한다')
            assert.equal(added, store.all()[0], '넣은 그 항목을 돌려줘야 한다')

            store.add('빨래 개기')
            assert.deepEqual(store.all().map((task) => task.title), ['우유 사기', '빨래 개기'])
      - type: cmd
        label: "6장의 검사가 그대로 따라온다 — 규칙을 옮겨 적지 않았다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore()
            const rejects = (title, what) => {
              try {
                store.add(title)
              } catch (error) {
                assert.equal(
                  error.name,
                  'InvalidInputError',
                  `${what}: 기존 규칙이 그대로 통해야 한다 (받은 이름: ${error.name})`,
                )
                return
              }
              assert.fail(`${what}: 껍질이 규칙을 우회했다`)
            }

            rejects('', '빈 제목')
            rejects('   ', '공백뿐인 제목')
            assert.equal(store.all().length, 0, '거부했으면 목록에 남으면 안 된다')
      - type: cmd
        label: "제목으로 완료하고, 없으면 undefined 를 돌려준다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore([
              { title: '우유 사기', done: false },
              { title: '빨래 개기', done: false },
            ])

            const target = store.complete('빨래 개기')
            assert.equal(target.done, true, '지목한 것이 완료돼야 한다')
            assert.equal(store.all()[0].done, false, '지목하지 않은 것은 그대로여야 한다')
            assert.equal(store.all()[1].done, true, '목록 안의 그 항목이 바뀌어야 한다')

            assert.equal(store.complete('세차하기'), undefined, '못 찾은 것은 실패가 아니다')
    review_card:
      front: "클래스 메서드가 기존 함수를 부르기만 하고 규칙을 옮겨 적지 않는 이유는?"
      back: "규칙이 두 벌이 되면 언젠가 어긋난다. 규칙은 한 곳에만 둔다"
      answer_pattern: "두 ?벌|어긋|중복|한 ?곳"

  - id: ch08-s04
    concept: private-field
    kind: edit
    goal: "목록을 밖에서 만질 수 없게 감춘다"
    teach: |
      아직 큰 구멍이 남아 있다.

        store.tasks.push({ 제목없음: true })

      이러면 6장의 검사를 통째로 건너뛰고 아무거나 밀어 넣을 수 있다.
      메서드를 아무리 잘 만들어도 **옆문이 열려 있으면 소용없다.**

      필드 이름 앞에 `#` 를 붙이면 **그 클래스 안에서만** 보인다.

        export class TaskStore {
          #tasks

          constructor(tasks = []) {
            this.#tasks = tasks
          }

          all() {
            return this.#tasks.slice()
          }

          add(title) {
            return addTask(this.#tasks, title)
          }

          complete(title) {
            return completeTask(this.#tasks, title)
          }
        }

      밖에서 `store.#tasks` 라고 쓰면 오류도 아니고 **문법 오류** 다 — 실행조차 되지 않는다.
      `store.tasks` 는 그냥 `undefined` 다. 그런 것이 없기 때문이다.

      **`all()` 이 `.slice()` 로 복사본을 돌려주는 것** 이 이 스텝의 절반이다.
      감춰 놓고 원본을 그대로 돌려주면 감춘 의미가 없다 — 받은 쪽이 그 배열을 그대로 밀어 버릴 수 있다.
      `slice()` 는 배열을 복사해 돌려준다. 복사본에 무슨 짓을 하든 안쪽은 무사하다.

      감추는 것은 불편하게 만들려는 것이 아니다. **바꾸는 길을 메서드 하나로 좁히는 것** 이다.
      길이 하나면 그 길에만 규칙을 걸면 된다.
    predict:
      question: "`#tasks` 로 감춰 놓고 `all()` 이 `this.#tasks` 를 그대로 돌려주면, 감춘 효과가 있을까?"
      answer_pattern: "없|아니|소용|의미 ?없|같"
      reveal: |
        거의 없다. `store.all().push(아무거나)` 한 줄이면 안쪽 배열이 그대로 바뀐다.
        감췄다고 믿고 있는데 실제로는 열려 있는 상태가 가장 위험하다 — 아예 열어 둔 것보다 나쁘다.
        그래서 안쪽 것을 내보낼 때는 복사본을 준다.
    fade:
      copy: |
        export class TaskStore {
          #tasks

          constructor(tasks = []) {
            this.#tasks = tasks
          }

          all() {
            return this.#tasks.slice()
          }
        }
      fill: |
        export class TaskStore {
          ____tasks

          constructor(tasks = []) {
            this.#tasks = tasks
          }

          all() {
            return this.#tasks.____()
          }
        }
      recall: "목록 필드를 밖에서 못 보게 감추고, 내보낼 때는 복사본을 주게 한다"
    hints:
      - "메서드를 아무리 잘 만들어도 목록을 직접 만질 수 있으면 규칙이 우회된다."
      - "필드 이름 앞에 표시를 붙여 감추고, 안쪽 배열을 내보내는 자리에서는 복사해서 준다."
      - "#tasks 로 바꾸고 모든 this.tasks 를 this.#tasks 로 고친 뒤, all() 은 this.#tasks.slice() 를 돌려준다."
    verify:
      - type: cmd
        label: "밖에서는 목록 필드가 보이지 않는다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore([{ title: '우유 사기', done: false }])

            assert.equal(store.tasks, undefined, '목록이 밖에서 그대로 보이면 감춘 것이 아니다')
            assert.deepEqual(Object.keys(store), [], '밖으로 드러난 필드가 없어야 한다')
            assert.equal(store.all().length, 1, '메서드로는 여전히 읽을 수 있어야 한다')
      - type: cmd
        label: "내보낸 목록을 건드려도 안쪽은 무사하다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore([{ title: '우유 사기', done: false }])

            const escaped = store.all()
            escaped.push({ title: '몰래 넣은 것', done: false })
            escaped.length = 0

            assert.equal(store.all().length, 1, '내보낸 것은 복사본이어야 한다 — 원본을 주면 감춘 의미가 없다')
            assert.equal(store.all()[0].title, '우유 사기')
      - type: cmd
        label: "감춘 필드는 밖에서 이름조차 쓸 수 없다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            const store = new TaskStore()
            console.log(store.#tasks)
        expect_exit: 1
      - type: cmd
        label: "추가와 완료는 그대로 동작한다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore()
            store.add('우유 사기')
            store.add('빨래 개기')
            store.complete('우유 사기')

            const all = store.all()
            assert.equal(all.length, 2)
            assert.equal(all[0].done, true, '완료가 안쪽 목록에 반영돼야 한다')
            assert.equal(all[1].done, false)
    review_card:
      front: "#로 감춘 필드를 메서드가 그대로 돌려주면?"
      back: "감춘 의미가 없다. 받은 쪽이 원본을 바꿀 수 있으므로 복사본을 준다"
      answer_pattern: "복사|없|소용|slice"
    explain:
      question: "감추는 것이 '불편하게 만들기'가 아니라면, 무엇을 얻으려는 것인가?"
      model_answer: |
        바꾸는 길을 좁히는 것이다. 목록을 아무나 만질 수 있으면 규칙을 걸 자리가 온 코드에 흩어진다.
        길을 메서드 하나로 좁히면 그 길목에만 검사를 두면 되고, 나중에 목록을 배열이 아닌 다른 것으로
        바꾸더라도 밖에서는 아무것도 달라지지 않는다. 감춘 것은 마음대로 바꿀 수 있고,
        드러낸 것은 함부로 못 바꾼다 — 그래서 드러내는 것을 최소로 둔다.
      keywords:
        - term: "길"
          nudge: "목록을 바꿀 수 있는 경로가 몇 개인지 세어 본다."
        - term: "바꾸"
          nudge: "안쪽 구현을 나중에 갈아 끼울 수 있는지 생각해 본다."

  - id: ch08-s05
    concept: getter
    kind: edit
    goal: "계산해서 얻는 값을 필드처럼 읽히게 한다"
    teach: |
      `list` 는 전체 개수와 남은 개수를 알린다. 지금은 이렇게 될 것이다.

        store.all().length          전체
        countPending(store.all())   남은 것

      개수를 알자고 목록 전체를 복사해 내오는 것도 이상하고, 밖에서 다시 계산하는 것도 이상하다.
      **틀이 아는 것은 틀이 알려 주어야 한다.**

      메서드 앞에 `get` 을 붙이면 **괄호 없이 필드처럼 읽힌다.**

        import { addTask, completeTask, countPending } from './tasks.mjs'

        export class TaskStore {
          ...

          get size() {
            return this.#tasks.length
          }

          get pending() {
            return countPending(this.#tasks)
          }
        }

      쓰는 쪽은 이렇게 된다.

        store.size      → 2      괄호가 없다
        store.pending   → 1

      필드처럼 보이지만 **읽을 때마다 계산된다.** 그래서 목록이 바뀌면 다음에 읽을 때 값도 바뀐다.
      필드였다면 바뀔 때마다 직접 고쳐 줘야 하고, 고치는 것을 잊는 순간 거짓말이 된다.

      **읽기 전용이다.** `get` 만 두고 짝이 되는 `set` 을 두지 않았으므로 대입할 수 없다.
      모듈 안의 코드는 엄격 모드로 도니까, `store.size = 99` 는 조용히 무시되지 않고 **TypeError로 터진다.**
      계산해서 나오는 값에 대입하는 것은 애초에 말이 안 되니, 터지는 편이 맞다.
    fade:
      copy: |
        get size() {
          return this.#tasks.length
        }

        get pending() {
          return countPending(this.#tasks)
        }
      fill: |
        ____ size() {
          return this.#tasks.length
        }

        ____ pending() {
          return ____(this.#tasks)
        }
      recall: "전체 개수와 남은 개수를 괄호 없이 읽을 수 있게 하되, 읽을 때마다 계산되게 한다"
    hints:
      - "개수를 알자고 목록 전체를 복사해 내오는 것은 과하다. 틀이 직접 알려 줄 수 있다."
      - "메서드 앞에 낱말 하나를 붙이면 괄호 없이 읽힌다. 남은 개수는 기존 함수에 맡긴다."
      - "get size() { return this.#tasks.length } 와 get pending() { return countPending(this.#tasks) } 를 둔다."
    verify:
      - type: cmd
        label: "괄호 없이 개수를 읽을 수 있다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore([
              { title: '우유 사기', done: false },
              { title: '빨래 개기', done: true },
            ])

            assert.equal(store.size, 2, 'store.size 는 괄호 없이 숫자를 돌려줘야 한다')
            assert.equal(store.pending, 1, '아직 안 끝난 것만 세야 한다')
      - type: cmd
        label: "읽을 때마다 다시 계산된다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore()
            assert.equal(store.size, 0)
            assert.equal(store.pending, 0)

            store.add('우유 사기')
            store.add('빨래 개기')
            assert.equal(store.size, 2, '추가한 뒤 다시 읽으면 늘어 있어야 한다')
            assert.equal(store.pending, 2)

            store.complete('우유 사기')
            assert.equal(store.size, 2, '완료해도 전체 개수는 그대로다')
            assert.equal(store.pending, 1, '완료하면 남은 개수가 줄어야 한다')
      - type: cmd
        label: "읽기 전용이다 — 대입하면 터진다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { TaskStore } from './lib/task-store.mjs'
            import assert from 'node:assert/strict'

            const store = new TaskStore([{ title: '우유 사기', done: false }])

            assert.throws(
              () => {
                store.size = 99
              },
              TypeError,
              '계산해서 나오는 값에 대입할 수 있으면 안 된다 (get 만 두고 set 은 두지 않는다)',
            )
            assert.equal(store.size, 1, '대입 시도 뒤에도 값은 그대로여야 한다')
    review_card:
      front: "get 을 붙인 메서드가 그냥 필드와 다른 점은?"
      back: "읽을 때마다 계산된다. 그래서 안쪽이 바뀌어도 값이 저절로 맞는다"
      answer_pattern: "계산|매번|읽을 ?때"

  - id: ch08-s06
    concept: store-cli
    kind: edit
    boss: true
    goal: "app.mjs 가 배열 대신 틀을 쓰게 한다"
    teach: |
      마지막이다. 힌트는 없다.

      지금 `app.mjs` 는 배열을 손에 들고 `addTask(tasks, title)` 처럼 함수마다 넘기고 있다.
      그 일을 전부 `TaskStore` 에 맡긴다.

      조건은 하나로 요약된다 —
      **`app.mjs` 안에 `addTask`·`completeTask`·`countPending` 이 한 번도 나오지 않는다.**
      그 이름들이 남아 있다면 아직 배열을 직접 다루고 있다는 뜻이다.

      요구사항은 다섯이다.

        1. 시작할 때 `new TaskStore(await readTasks())` 로 틀을 만든다.
           읽기 실패는 지금처럼 이유를 알리고 종료 코드 1로 끝낸다
        2. `add` 는 `store.add(title)`, `done` 은 `store.complete(title)` 을 쓴다
        3. 저장할 때는 `store.all()` 을 넘긴다. 파일에 들어가는 모양은 전과 같아야 한다
        4. `list` 는 `store.size` 와 `store.pending` 을 괄호 없이 읽어 쓴다
        5. 6·7장에서 세운 것은 전부 그대로다 — 빈 제목은 `추가하지 못했다`,
           없는 제목은 `그런 할 일이 없다`, 망가진 파일은 이유를 알리고, 스택은 보이지 않는다

      화면에 나오는 것은 7장 마지막과 **한 글자도 다르지 않아야 한다.**
      겉이 그대로인데 속이 정리되는 것 — 5장에서 한 그 일을 한 번 더 한다.

      다만 이번에는 확인해 줄 사람이 나뿐이다. 눈으로 일일이 대조해야 한다.
      **다음 장에서 이 일을 기계에게 넘긴다.**
    verify:
      - type: fs
        label: "app.mjs 가 목록을 직접 다루지 않는다"
        path: "app.mjs"
        not_matches: ['addTask\(', 'completeTask\(', 'countPending\(']
      - type: fs
        label: "app.mjs 가 틀을 찍어 내 쓴다"
        path: "app.mjs"
        matches: ['new\s+TaskStore\s*\(', 'store\.size', 'store\.pending']
      - type: cmd
        label: "빈 상태에서 시작해 쌓이고, 껐다 켜도 이어진다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { execFile } from 'node:child_process'
            import { promisify } from 'node:util'
            import { readFile, writeFile, rm } from 'node:fs/promises'
            import assert from 'node:assert/strict'

            const run = promisify(execFile)
            const keep = await readFile('tasks.json', 'utf8').catch(() => null)
            const restore = async () => (keep === null
              ? rm('tasks.json', { force: true })
              : writeFile('tasks.json', keep))

            try {
              await rm('tasks.json', { force: true })

              await run(process.execPath, ['app.mjs', 'add', '우유 사기'])
              await run(process.execPath, ['app.mjs', 'add', '빨래 개기'])

              const saved = JSON.parse(await readFile('tasks.json', 'utf8'))
              assert.deepEqual(
                saved.map((task) => task.title),
                ['우유 사기', '빨래 개기'],
                '따로 실행한 두 번의 add 가 모두 남아 있어야 한다',
              )
              assert.deepEqual(
                saved.map((task) => task.done),
                [false, false],
                '파일에 들어가는 모양이 전과 같아야 한다',
              )
            } finally {
              await restore()
            }
      - type: cmd
        label: "done 이 파일에 반영되고, 지목한 것만 바뀐다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { execFile } from 'node:child_process'
            import { promisify } from 'node:util'
            import { readFile, writeFile, rm } from 'node:fs/promises'
            import assert from 'node:assert/strict'

            const run = promisify(execFile)
            const keep = await readFile('tasks.json', 'utf8').catch(() => null)
            const restore = async () => (keep === null
              ? rm('tasks.json', { force: true })
              : writeFile('tasks.json', keep))

            try {
              await writeFile('tasks.json', JSON.stringify([
                { title: '우유 사기', done: false },
                { title: '빨래 개기', done: false },
              ]))

              const { stdout } = await run(process.execPath, ['app.mjs', 'done', '빨래 개기'])
              assert.match(stdout, /완료: \[x\] 빨래 개기/)

              const saved = JSON.parse(await readFile('tasks.json', 'utf8'))
              assert.equal(saved[1].done, true, '지목한 것이 완료로 저장돼야 한다')
              assert.equal(saved[0].done, false, '지목하지 않은 것은 그대로여야 한다')
            } finally {
              await restore()
            }
      - type: cmd
        label: "list 는 개수를 알리고 파일을 건드리지 않는다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { execFile } from 'node:child_process'
            import { promisify } from 'node:util'
            import { readFile, writeFile, rm } from 'node:fs/promises'
            import assert from 'node:assert/strict'

            const run = promisify(execFile)
            const keep = await readFile('tasks.json', 'utf8').catch(() => null)
            const restore = async () => (keep === null
              ? rm('tasks.json', { force: true })
              : writeFile('tasks.json', keep))

            try {
              const before = '[{"title":"장보기","done":false},{"title":"설거지","done":true}]'
              await writeFile('tasks.json', before)

              const { stdout } = await run(process.execPath, ['app.mjs', 'list'])
              assert.match(stdout, /할 일 2개 \(남은 것 1개\)/, '개수 안내가 7장과 같아야 한다')
              assert.match(stdout, /1\. \[ \] 장보기/)
              assert.match(stdout, /2\. \[x\] 설거지/)

              assert.equal(await readFile('tasks.json', 'utf8'), before, 'list 가 파일을 다시 써서는 안 된다')
            } finally {
              await restore()
            }
      - type: cmd
        label: "6·7장에서 세운 실패 처리가 그대로다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { execFile } from 'node:child_process'
            import { promisify } from 'node:util'
            import { readFile, writeFile, rm } from 'node:fs/promises'
            import assert from 'node:assert/strict'

            const run = promisify(execFile)
            const keep = await readFile('tasks.json', 'utf8').catch(() => null)
            const restore = async () => (keep === null
              ? rm('tasks.json', { force: true })
              : writeFile('tasks.json', keep))
            const output = (result) => `${result.stdout ?? ''}${result.stderr ?? ''}`

            try {
              await rm('tasks.json', { force: true })

              const empty = await run(process.execPath, ['app.mjs', 'add']).catch((error) => error)
              assert.equal(empty.code, 1, '빈 제목은 실패로 끝나야 한다')
              assert.match(output(empty), /추가하지 못했다/)
              assert.doesNotMatch(output(empty), /^\s+at\s/m, '스택 트레이스를 보이면 안 된다')

              await writeFile('tasks.json', JSON.stringify([{ title: '우유 사기', done: false }]))
              const missing = await run(process.execPath, ['app.mjs', 'done', '세차하기']).catch((error) => error)
              assert.equal(missing.code, 1)
              assert.match(output(missing), /그런 할 일이 없다/)

              await writeFile('tasks.json', '[{"title": "우유 사기",')
              const broken = await run(process.execPath, ['app.mjs', 'list']).catch((error) => error)
              assert.equal(broken.code, 1, '망가진 파일이면 실패로 끝나야 한다')
              assert.match(output(broken), /파일/)
              assert.doesNotMatch(output(broken), /^\s+at\s/m, '스택 트레이스를 보이면 안 된다')
            } finally {
              await restore()
            }
    review_card:
      front: "겉으로 보이는 동작이 하나도 안 바뀌는 변경을 무엇이라 하는가?"
      back: "리팩터링. 겉은 그대로 두고 속만 정리한다"
      answer_pattern: "리팩터|refactor|정리|구조"
    explain:
      question: "이번 변경이 맞게 됐는지 지금은 어떻게 확인했나? 그 방법의 문제는 무엇인가?"
      model_answer: |
        명령을 하나씩 쳐 보고 화면을 눈으로 대조했다. 문제는 세 가지다.
        느리고, 빠뜨리기 쉽고, 다음에 또 고칠 때 처음부터 다시 해야 한다.
        게다가 확인한 사람만 알고 있어서 기록으로 남지 않는다.
        이 확인을 글로 적어 두고 기계가 대신 돌리게 하면 그 셋이 한 번에 해결된다. 그것이 다음 장이다.
      keywords:
        - term: "눈"
          nudge: "무엇을 보고 '맞다'고 판단했는지 떠올려 본다."
        - term: "다시"
          nudge: "다음에 또 고칠 때 무슨 일을 반복해야 하는지 생각해 본다."
