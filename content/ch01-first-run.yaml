id: ch01
title: "1장 · 코드를 실행시키다"
goal: "내 컴퓨터에서 자바스크립트 파일을 만들고 직접 실행해 결과를 눈으로 본다"
intro: |
  자바스크립트를 배우겠다고 마음먹었다. 그런데 첫 관문은 문법이 아니다.
  '내가 쓴 코드가 실제로 돌아가는 것을 내 눈으로 확인하는 것'이다.

  브라우저 콘솔에 한 줄씩 쳐 보는 것으로는 오래 못 간다. 파일에 적고, 실행하고,
  틀리면 고쳐서 다시 실행하는 이 짧은 순환이 앞으로 모든 학습의 바닥이 된다.
  터미널을 열어 두고 한 스텝씩 직접 손으로 해 나간다.

steps:
  - id: ch01-s01
    concept: node-runtime
    kind: command
    goal: "내 컴퓨터의 Node 버전을 확인한다"
    teach: |
      자바스크립트는 원래 브라우저 안에서만 돌던 언어였다.
      Node는 그 자바스크립트를 브라우저 밖, 즉 내 컴퓨터에서 그냥 실행해 주는 프로그램이다.

      Node가 있으면 HTML도 브라우저도 없이 `.js` 파일 하나만으로 코드를 돌려볼 수 있다.
      이 도장은 그 방식으로 진행한다. 먼저 설치되어 있는지 확인한다.

        node -v

      v22 이상이 찍히면 준비가 된 것이다.
    predict:
      question: "`node -v` 를 치면 무엇이 찍힐까? 자바스크립트의 버전일까, 다른 것의 버전일까?"
      answer_pattern: "node|노드|런타임|다른|아니"
      reveal: |
        Node 자신의 버전이다. 자바스크립트라는 언어에는 v24 같은 번호가 붙지 않는다.
        언어의 판올림은 ES2015, ES2020처럼 연도로 부르고, Node는 그 언어를 실행하는
        프로그램이라 따로 자기 버전을 갖는다.
    hints:
      - "터미널이면 어느 폴더에서 쳐도 상관없다. 프로젝트 안일 필요가 없다."
      - "명령은 세 글자 + 공백 + 하이픈 v 다."
      - "node -v 를 치고 Enter."
    verify:
      - type: cmd
        label: "Node 22 이상이 설치되어 있다"
        run: ["node", "-v"]
        cwd: root
        expect_output: '^v(2[2-9]|[3-9][0-9])\.'
    review_card:
      front: "Node는 자바스크립트에 무엇을 해 주는가?"
      back: "브라우저 밖에서 자바스크립트를 실행해 주는 런타임"
      answer_pattern: "실행|런타임|브라우저 밖"

  - id: ch01-s02
    concept: script-file
    kind: edit
    goal: "workspace 폴더를 만들고 첫 스크립트를 실행한다"
    teach: |
      이제 코드를 담을 내 작업 폴더를 만든다. 이 도장 폴더 안에 `workspace` 라는 이름으로 만든다.
      앞으로 쓰는 모든 코드는 그 안에 쌓인다.

      도장 최상위 폴더에서:

        mkdir workspace

      그리고 `workspace/hello.mjs` 파일을 만들어 아래 한 줄을 적는다.

        console.log('안녕, 자바스크립트')

      `console.log` 는 괄호 안의 값을 터미널에 찍어 주는 명령이다.
      확장자를 `.mjs` 로 두는 이유는 뒤에서 모듈을 배울 때 설명한다. 지금은 그냥 따른다.

      다 적었으면 workspace 폴더에서 실행해 본다.

        node hello.mjs
    fade:
      copy: "console.log('안녕, 자바스크립트')"
      fill: "____('안녕, 자바스크립트')"
      recall: "터미널에 '안녕, 자바스크립트' 를 찍는 한 줄을 적는다"
    hints:
      - "파일을 만들었는데 아무것도 안 찍힌다면, 실행한 폴더가 workspace가 맞는지 본다."
      - "workspace/hello.mjs 안에 console.log 한 줄만 있으면 된다."
      - "console.log('안녕, 자바스크립트') 를 적고 workspace 폴더에서 node hello.mjs 를 실행한다."
    verify:
      - type: fs
        label: "workspace/hello.mjs 파일이 있다"
        path: "hello.mjs"
        matches: ['console\.log']
      - type: cmd
        label: "실행하면 인사말이 찍힌다"
        run: ["node", "hello.mjs"]
        expect_output: "안녕, 자바스크립트"
    review_card:
      front: "값을 터미널에 찍어 보는 함수는?"
      back: "console.log"
      answer_pattern: "console\\.?log"
    explain:
      question: "브라우저 콘솔에 직접 치는 대신 파일에 적고 node로 실행하면 무엇이 좋은가?"
      model_answer: |
        코드가 파일로 남기 때문이다. 콘솔에 친 것은 새로고침하면 사라지지만, 파일은 다시 실행할 수 있고
        고쳐서 또 실행할 수 있고 나중에 git으로 이력까지 남길 수 있다. 프로그래밍은 한 번 맞히는 일이 아니라
        고쳐 가며 반복하는 일이라, 코드가 남아 있는 쪽이 압도적으로 유리하다.
      keywords:
        - term: "남"
          nudge: "'다시 실행할 수 있다'는 점을 짚어 보면 이유가 분명해진다."
        - term: "반복"
          nudge: "고쳐서 다시 돌리는 순환이 왜 중요한지 생각해 본다."

  - id: ch01-s03
    concept: const-binding
    kind: edit
    goal: "값에 이름을 붙여 다시 쓴다"
    teach: |
      같은 값을 두 번 적어야 한다면 이름을 붙일 때가 된 것이다. 이름을 붙이는 방법은 두 가지다.

        const 이름 = 값    — 다시 대입할 수 없다
        let   이름 = 값    — 나중에 다시 대입할 수 있다

      기본은 `const` 다. 바뀌지 않는다고 선언해 두면, 읽는 사람이 '이 값은 아래에서 변하지 않는다'를
      확인하지 않고 넘어갈 수 있다. 바꿔야 할 때만 `let` 으로 내린다.

      `hello.mjs` 를 고쳐 이름을 하나 상수로 두고, 그 이름을 써서 인사를 찍는다.

        const name = '자바스크립트'
        console.log(`안녕, ${name}`)

      백틱(`` ` ``)으로 감싼 문자열 안에서는 `${...}` 로 값을 끼워 넣을 수 있다.
    fade:
      copy: |
        const name = '자바스크립트'
        console.log(`안녕, ${name}`)
      fill: |
        ____ name = '자바스크립트'
        console.log(`안녕, ${____}`)
      recall: "이름을 상수로 두고, 그 이름을 끼워 넣어 인사말을 찍는다"
    hints:
      - "인사말 안의 '자바스크립트' 를 직접 적지 않고 이름으로 대신 부를 수 있다."
      - "hello.mjs 첫 줄에 상수를 선언하고, console.log 쪽에서 그 이름을 쓴다."
      - "const name = '자바스크립트' 를 선언하고 console.log(`안녕, ${name}`) 로 바꾼다."
    verify:
      - type: fs
        label: "const로 이름을 선언했다"
        path: "hello.mjs"
        matches: ['const\s+\w+\s*=']
        not_matches: ['\bvar\b']
      - type: fs
        label: "값을 직접 적지 않고 끼워 넣었다"
        path: "hello.mjs"
        matches: ['\$\{\s*\w+\s*\}']
      - type: cmd
        label: "실행 결과는 그대로다"
        run: ["node", "hello.mjs"]
        expect_output: "안녕, 자바스크립트"
    review_card:
      front: "다시 대입하지 않을 값에 쓰는 선언 키워드는?"
      back: "const"
      answer_pattern: "const"
