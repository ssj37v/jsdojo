id: ch03
title: "3장 · 목록을 담는다"
goal: "할 일을 배열과 객체에 담아, 쌓고 꺼내고 상태를 바꾼다"
intro: |
  2장의 `app.mjs` 에는 결정적인 구멍이 하나 있다. `add` 를 아무리 눌러도 아무것도 쌓이지 않는다.
  할 일 한 줄을 예쁘게 찍고는 그대로 잊어버린다.

  값을 하나씩만 다루는 이름으로는 목록을 만들 수 없다. `const title = ...` 은 한 번에 하나뿐이다.
  **여러 값을 하나의 이름으로 묶는 그릇** 이 필요하다. 그것이 배열이다.

  그리고 할 일에는 제목만 있는 게 아니다. 끝냈는지 여부도 같이 다녀야 한다.
  흩어진 값 여럿을 한 덩어리로 묶는 그릇도 필요하다. 그것이 객체다.

  이 장이 끝나면 목록이 생긴다. 아직 프로그램이 꺼지면 사라지지만, 그것은 7장에서 해결한다.

steps:
  - id: ch03-s01
    concept: array-literal
    kind: edit
    goal: "할 일들을 배열에 담고 list 명령으로 개수를 센다"
    teach: |
      값 여러 개를 하나의 이름으로 묶으려면 **배열** 을 쓴다. 대괄호 안에 쉼표로 나열한다.

        const tasks = ['우유 사기', '빨래 개기']

      배열에 몇 개가 들었는지는 `.length` 로 알 수 있다.

        tasks.length   → 2

      `app.mjs` 위쪽, 명령을 읽기 전에 배열을 하나 둔다. 그리고 명령이 하나 늘어난다 — `list` 다.

        } else if (command === 'list') {
          console.log(`할 일 ${tasks.length}개`)
        }

      `list` 는 제목이 필요 없으므로 `&& title` 을 붙이지 않는다. 사용법 문구도 함께 고친다.

        const USAGE = '사용법: node app.mjs <add|done|list> [할 일 제목]'

      확인한다.

        node app.mjs list      → 할 일 2개
    fade:
      copy: |
        const tasks = ['우유 사기', '빨래 개기']

        } else if (command === 'list') {
          console.log(`할 일 ${tasks.length}개`)
        }
      fill: |
        const tasks = ____'우유 사기', '빨래 개기'____

        } else if (command === 'list') {
          console.log(`할 일 ${tasks.____}개`)
        }
      recall: "할 일 두 개를 배열에 담고, list 명령이 그 개수를 알려 주게 한다"
    hints:
      - "값을 하나만 담는 이름으로는 목록이 되지 않는다. 여러 개를 한 이름에 넣는 문법이 필요하다."
      - "명령을 읽기 전에 배열을 선언하고, if 사슬에 list 가지를 하나 더 붙인다."
      - "const tasks = ['우유 사기', '빨래 개기'] 를 두고, else if (command === 'list') 안에서 tasks.length 를 찍는다."
    verify:
      - type: fs
        label: "배열에 할 일을 담았다"
        path: "app.mjs"
        matches: ['const\s+tasks\s*=\s*\[']
      - type: cmd
        label: "list 는 담긴 개수를 알려 준다"
        run: ["node", "app.mjs", "list"]
        expect_output: '할 일 2개'
      - type: cmd
        label: "모르는 명령은 여전히 실패로 끝난다"
        run: ["node", "app.mjs"]
        expect_exit: 1
        expect_output: '사용법'
    review_card:
      front: "배열에 값이 몇 개 들었는지 알려 주는 것은?"
      back: ".length"
      answer_pattern: "length|길이"

  - id: ch03-s02
    concept: array-index
    kind: edit
    goal: "배열에서 첫 번째와 마지막 할 일을 꺼내 본다"
    teach: |
      배열에 담긴 값은 **자리 번호** 로 꺼낸다. 번호는 0부터 센다.

        tasks[0]   첫 번째
        tasks[1]   두 번째

      0부터 세기 때문에 마지막 자리는 `길이 - 1` 이다. 값이 2개면 마지막은 `tasks[1]` 이다.

        tasks[tasks.length - 1]   마지막

      마지막을 이렇게 적는 이유는 개수가 몇 개든 통하기 때문이다. `tasks[1]` 이라고 박아 두면
      할 일이 세 개가 되는 순간 틀린 것을 가리킨다.

      `list` 가 개수만 알려 주지 말고 처음과 마지막도 보여 주게 한다.

        console.log(`할 일 ${tasks.length}개`)
        console.log(`처음: ${formatTask(tasks[0])}`)
        console.log(`마지막: ${formatTask(tasks[tasks.length - 1])}`)
    predict:
      question: "할 일이 2개뿐인데 `tasks[2]` 를 꺼내면 무엇이 나올까? 오류가 날까?"
      answer_pattern: "undefined|언디파인|없|아니"
      reveal: |
        오류가 나지 않고 `undefined` 가 나온다. 자바스크립트는 없는 자리를 꺼내도 멈추지 않는다.
        편해 보이지만 위험한 성질이다 — 잘못된 번호를 써도 그 자리에서 알려 주지 않고,
        한참 뒤 `undefined` 를 쓰려는 순간에야 터진다. 그래서 마지막 자리는 직접 세지 않고
        `length - 1` 로 계산해 둔다.
    fade:
      copy: |
        console.log(`할 일 ${tasks.length}개`)
        console.log(`처음: ${formatTask(tasks[0])}`)
        console.log(`마지막: ${formatTask(tasks[tasks.length - 1])}`)
      fill: |
        console.log(`할 일 ${tasks.length}개`)
        console.log(`처음: ${formatTask(tasks[____])}`)
        console.log(`마지막: ${formatTask(tasks[tasks.length ____])}`)
      recall: "list 가 개수에 더해 처음과 마지막 할 일도 보여 주게 한다"
    hints:
      - "배열은 0부터 센다. 그러면 마지막 자리 번호는 개수와 어떤 관계일까."
      - "list 가지 안에서 tasks 의 자리 번호로 값을 꺼내 formatTask 에 넘긴다."
      - "tasks[0] 과 tasks[tasks.length - 1] 을 각각 formatTask 에 넘겨 '처음: ' '마지막: ' 을 붙여 찍는다."
    verify:
      - type: fs
        label: "자리 번호로 값을 꺼낸다"
        path: "app.mjs"
        matches: ['tasks\[0\]', 'tasks\.length\s*-\s*1']
      - type: cmd
        label: "첫 번째 할 일을 보여 준다"
        run: ["node", "app.mjs", "list"]
        expect_output: '처음: \[ \] 우유 사기'
      - type: cmd
        label: "마지막 할 일을 보여 준다"
        run: ["node", "app.mjs", "list"]
        expect_output: '마지막: \[ \] 빨래 개기'
    review_card:
      front: "배열 tasks 의 마지막 값을 꺼내는 식은?"
      back: "tasks[tasks.length - 1] — 0부터 세므로 마지막은 길이보다 1 작다"
      answer_pattern: "length\\s*-\\s*1"

  - id: ch03-s03
    concept: array-push
    kind: edit
    goal: "add 명령이 실제로 목록에 쌓이게 한다"
    teach: |
      드디어 이 장의 목적이다. 지금 `add` 는 한 줄 찍고 끝난다. 목록에 넣지 않는다.

      배열 끝에 값을 붙이는 것은 `push` 다.

        tasks.push('장보기')

      `add` 가지를 고쳐, 찍기 전에 먼저 목록에 넣고 넣은 뒤의 개수를 알리게 한다.

        if (command === 'add' && title) {
          tasks.push(title)
          console.log(`추가: ${formatTask(title)}`)
          console.log(`할 일 ${tasks.length}개`)
        }

      확인한다. 준 제목이 무엇이든 개수가 하나 늘어야 한다.

        node app.mjs add "장보기"    → 추가: [ ] 장보기 / 할 일 3개
        node app.mjs list            → 할 일 2개

      두 번째 줄이 다시 2개인 것이 이상해 보이면 제대로 본 것이다. 프로그램이 끝나면 배열은
      사라지고, 다음 실행은 처음부터 다시 시작한다. **남기는 방법은 7장에서 배운다.**
      지금은 한 번의 실행 안에서 쌓이는 것까지 만든다.
    fade:
      copy: |
        if (command === 'add' && title) {
          tasks.push(title)
          console.log(`추가: ${formatTask(title)}`)
          console.log(`할 일 ${tasks.length}개`)
        }
      fill: |
        if (command === 'add' && title) {
          tasks.____(____)
          console.log(`추가: ${formatTask(title)}`)
          console.log(`할 일 ${tasks.length}개`)
        }
      recall: "add 가 받은 제목을 목록에 넣고, 넣은 뒤의 개수를 함께 알리게 한다"
    hints:
      - "화면에는 찍히는데 개수가 그대로라면, 아직 목록에는 넣지 않은 것이다."
      - "add 가지 맨 앞에서 tasks 에 title 을 붙이고, 마지막에 개수를 한 줄 더 찍는다."
      - "tasks.push(title) 을 넣고 console.log(`할 일 ${tasks.length}개`) 를 덧붙인다."
    verify:
      - type: fs
        label: "배열에 값을 붙인다"
        path: "app.mjs"
        matches: ['tasks\.push\(']
      - type: cmd
        label: "추가하면 개수가 늘어난다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '할 일 3개'
      - type: cmd
        label: "다른 제목을 줘도 그 제목이 들어간다"
        run: ["node", "app.mjs", "add", "설거지"]
        expect_output: '추가: \[ \] 설거지'
        reject_output: '장보기'
      - type: cmd
        label: "추가하지 않았을 때의 개수는 그대로다"
        run: ["node", "app.mjs", "list"]
        expect_output: '할 일 2개'
    review_card:
      front: "배열 끝에 값을 붙이는 메서드는?"
      back: "push"
      answer_pattern: "push"

  - id: ch03-s04
    concept: object-literal
    kind: edit
    goal: "할 일을 제목과 완료 여부를 함께 지닌 객체로 바꾼다"
    teach: |
      지금 배열에는 제목만 들어 있다. 그런데 할 일에는 '끝냈는지'도 따라다녀야 한다.
      제목 배열과 완료 여부 배열을 따로 두는 방법도 있지만, 그러면 둘의 순서가 어긋나는 순간 끝이다.

      서로 붙어 다녀야 하는 값들은 **객체** 로 한 덩어리를 만든다.
      중괄호 안에 `이름: 값` 을 쉼표로 나열한다.

        const task = { title: '우유 사기', done: false }

      꺼낼 때는 점을 찍는다.

        task.title   → '우유 사기'
        task.done    → false

      배열의 각 항목을 객체로 바꾼다. 여러 줄로 늘어놓아도 된다.

        const tasks = [
          { title: '우유 사기', done: false },
          { title: '빨래 개기', done: true },
        ]

      그러면 꺼내 쓰는 쪽도 함께 바뀐다. `formatTask` 는 손대지 않는다 — 제목과 완료 여부를
      받는다는 약속은 그대로다. 무엇을 넘기느냐만 달라진다.

        const first = tasks[0]
        const last = tasks[tasks.length - 1]
        console.log(`처음: ${formatTask(first.title, first.done)}`)
        console.log(`마지막: ${formatTask(last.title, last.done)}`)

      `push` 도 이제 객체를 넣어야 한다.

        tasks.push({ title: title, done: false })
    fade:
      copy: |
        const tasks = [
          { title: '우유 사기', done: false },
          { title: '빨래 개기', done: true },
        ]

        tasks.push({ title: title, done: false })

        const first = tasks[0]
        console.log(`처음: ${formatTask(first.title, first.done)}`)
      fill: |
        const tasks = [
          ____ title: '우유 사기', done: false ____,
          { title: '빨래 개기', done: true },
        ]

        tasks.push({ title: title, done: ____ })

        const first = tasks[0]
        console.log(`처음: ${formatTask(first.____, first.____)}`)
      recall: "배열의 각 항목을 제목과 완료 여부를 함께 지닌 객체로 바꾸고, 꺼내 쓰는 쪽도 맞춘다"
    hints:
      - "제목 배열과 완료 배열을 따로 두면 순서가 어긋나는 사고가 난다. 붙어 다녀야 할 값은 한 덩어리로 묶는다."
      - "tasks 의 각 항목을 중괄호로 바꾸고, formatTask 에 넘기는 값을 점 표기로 꺼낸다. push 도 객체를 넣도록 고친다."
      - "{ title: '우유 사기', done: false } 꼴로 두 개를 만들고, formatTask(tasks[0].title, tasks[0].done) 처럼 넘긴다. push 는 { title: title, done: false } 를 넣는다."
    verify:
      - type: fs
        label: "할 일을 객체로 담았다"
        path: "app.mjs"
        matches: ['\{\s*title\s*:']
      - type: cmd
        label: "끝낸 할 일은 목록에서도 [x] 로 보인다"
        run: ["node", "app.mjs", "list"]
        expect_output: '마지막: \[x\] 빨래 개기'
      - type: cmd
        label: "아직인 할 일은 [ ] 로 보인다"
        run: ["node", "app.mjs", "list"]
        expect_output: '처음: \[ \] 우유 사기'
      - type: cmd
        label: "추가는 여전히 목록에 쌓인다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '할 일 3개'
    review_card:
      front: "객체에서 title 값을 꺼내는 표기는?"
      back: "task.title — 점 표기"
      answer_pattern: "\\.title|점"
    explain:
      question: "제목 배열과 완료 여부 배열을 따로 두는 대신 객체 하나로 묶으면 무엇이 안전해지나?"
      model_answer: |
        둘의 순서가 어긋날 수 없게 된다. 배열 두 개로 나눠 두면 한쪽에만 값을 넣거나 한쪽만 정렬하는
        순간 3번 할 일의 제목과 5번 할 일의 완료 여부가 짝지어진다. 그런 어긋남은 오류를 내지 않고
        조용히 틀린 답을 낸다. 한 덩어리로 묶으면 그 실수 자체가 불가능해진다.
      keywords:
        - term: "순서"
          nudge: "두 배열을 따로 다루다 한쪽만 건드리면 무슨 일이 생기는지 떠올려 본다."
        - term: "같이"
          nudge: "붙어 다녀야 하는 값들이 실제로 붙어 있는지를 짚어 본다."

  - id: ch03-s05
    concept: object-mutation
    kind: edit
    goal: "done 명령이 목록 안의 상태를 실제로 바꾸게 한다"
    teach: |
      `done` 은 아직 거짓말을 하고 있다. 받은 제목을 `[x]` 모양으로 찍기만 할 뿐,
      목록 안의 할 일은 하나도 바뀌지 않는다. 겉모양만 완료다.

      객체의 속성은 만든 뒤에도 바꿀 수 있다. 점 표기로 꺼내는 그 자리에 대입하면 된다.

        first.done = true

      `const` 로 선언했는데 왜 바뀌느냐는 의문이 들면 정확히 본 것이다.
      `const` 가 막는 것은 **이름이 가리키는 대상을 바꾸는 것**(`tasks = []`)이지,
      **대상 안의 내용을 바꾸는 것**(`tasks.push(...)`, `first.done = true`)이 아니다.

      제목으로 찾아 완료 처리하려면 목록을 뒤지는 방법이 필요한데, 그건 4장의 `find` 다.
      지금은 **첫 번째 할 일** 을 완료로 바꾼다. `done` 은 이제 제목을 받지 않는다.

        } else if (command === 'done') {
          const first = tasks[0]
          first.done = true
          console.log(`완료: ${formatTask(first.title, first.done)}`)
          console.log(`처음: ${formatTask(tasks[0].title, tasks[0].done)}`)
        }

      마지막 줄이 중요하다. `first` 를 통해 바꿨는데 `tasks[0]` 을 다시 꺼내도 바뀌어 있다면,
      둘이 **같은 객체** 라는 뜻이다. 배열에서 꺼낸 것은 복사본이 아니다.

      사용법 문구도 고친다 — `done` 은 이제 제목이 필요 없다.

        const USAGE = '사용법: node app.mjs <add 제목 | done | list>'
    predict:
      question: "`first.done = true` 로 바꾼 뒤 `tasks[0].done` 을 꺼내면 무엇일까? false 일까 true 일까?"
      answer_pattern: "true|참|바뀐|같"
      reveal: |
        `true` 다. `const first = tasks[0]` 은 객체를 복사한 것이 아니라 **같은 객체를 가리키는 이름을
        하나 더 붙인 것**이다. 그래서 어느 이름으로 바꾸든 같은 것이 바뀐다.
        이 성질은 편리하기도 하고 위험하기도 하다 — 남에게 넘긴 객체를 그쪽에서 바꾸면 내 것도 바뀐다.
    fade:
      copy: |
        } else if (command === 'done') {
          const first = tasks[0]
          first.done = true
          console.log(`완료: ${formatTask(first.title, first.done)}`)
          console.log(`처음: ${formatTask(tasks[0].title, tasks[0].done)}`)
        }
      fill: |
        } else if (command === 'done') {
          const first = tasks[0]
          first.____ = ____
          console.log(`완료: ${formatTask(first.title, first.done)}`)
          console.log(`처음: ${formatTask(tasks[0].title, tasks[0].done)}`)
        }
      recall: "done 이 첫 번째 할 일의 완료 여부를 실제로 바꾸고, 목록에서 다시 꺼내 확인시키게 한다"
    hints:
      - "찍히는 모양만 바뀌고 목록은 그대로라면, 아직 아무것도 바꾸지 않은 것이다."
      - "done 가지에서 tasks[0] 을 꺼내 그 객체의 완료 속성에 값을 대입한다. && title 조건은 뗀다."
      - "const first = tasks[0] 뒤에 first.done = true 를 넣고, 마지막에 tasks[0] 을 다시 꺼내 찍는다."
    verify:
      - type: fs
        label: "객체의 속성을 바꾼다"
        path: "app.mjs"
        matches: ['\.done\s*=\s*true']
      - type: cmd
        label: "done 은 첫 번째 할 일을 완료로 만든다"
        run: ["node", "app.mjs", "done"]
        expect_output: '완료: \[x\] 우유 사기'
      - type: cmd
        label: "목록에서 다시 꺼내도 바뀌어 있다"
        run: ["node", "app.mjs", "done"]
        expect_output: '처음: \[x\] 우유 사기'
      - type: cmd
        label: "손대지 않았을 때는 아직 [ ] 다"
        run: ["node", "app.mjs", "list"]
        expect_output: '처음: \[ \] 우유 사기'
    review_card:
      front: "const 로 선언한 배열에 push 가 되는 이유는?"
      back: "const 는 이름이 가리키는 대상을 바꾸는 것만 막는다. 대상 안의 내용은 바꿀 수 있다"
      answer_pattern: "재할당|가리키|이름|대상"

  - id: ch03-s06
    concept: task-list
    kind: edit
    boss: true
    goal: "쌓고·꺼내고·바꾸는 세 명령을 갖춘 목록 CLI를 완성한다"
    teach: |
      이 장에서 익힌 배열·자리 번호·push·객체·속성 변경을 하나로 모은다. 힌트는 없다.

        node app.mjs add "장보기"
          → 추가: [ ] 장보기
            할 일 3개
            마지막: [ ] 장보기

        node app.mjs done
          → 완료: [x] 우유 사기
            처음: [x] 우유 사기

        node app.mjs list
          → 할 일 2개
            처음: [ ] 우유 사기
            마지막: [x] 빨래 개기

        node app.mjs            → 사용법을 알리고 종료 코드 1
        node app.mjs 지우기      → 사용법을 알리고 종료 코드 1

      요구사항은 넷이다.

        1. add 는 받은 제목을 객체로 만들어 목록에 넣고, 추가한 줄·개수·**마지막 항목** 을 찍는다.
           '마지막'은 방금 넣은 것을 목록에서 **다시 꺼내** 보여 주는 것이다. 넣은 값을 그대로
           또 찍는 것이 아니라, 자리 번호로 꺼내 확인시킨다.
        2. done 은 첫 번째 할 일의 완료 여부를 바꾸고, 바꾼 줄과 목록에서 다시 꺼낸 줄을 찍는다.
        3. list 는 개수·처음·마지막을 찍는다.
        4. 그 밖의 경우에는 사용법을 찍고 종료 코드 1로 끝낸다.

      `formatTask` 는 이번에도 손대지 않는다.
    verify:
      - type: cmd
        label: "add 는 넣은 것을 목록에서 다시 꺼내 보여 준다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '마지막: \[ \] 장보기'
      - type: cmd
        label: "add 는 개수를 함께 알린다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '할 일 3개'
      - type: cmd
        label: "다른 제목을 줘도 그것이 마지막이 된다"
        run: ["node", "app.mjs", "add", "설거지"]
        expect_output: '마지막: \[ \] 설거지'
        reject_output: '장보기'
      - type: cmd
        label: "done 은 목록 안의 상태를 바꾼다"
        run: ["node", "app.mjs", "done"]
        expect_output: '처음: \[x\] 우유 사기'
      - type: cmd
        label: "list 는 손대지 않은 목록을 그대로 보여 준다"
        run: ["node", "app.mjs", "list"]
        expect_output: '마지막: \[x\] 빨래 개기'
      - type: cmd
        label: "명령이 없으면 사용법을 알리고 실패로 끝낸다"
        run: ["node", "app.mjs"]
        expect_exit: 1
        expect_output: '사용법'
      - type: cmd
        label: "모르는 명령도 실패로 끝낸다"
        run: ["node", "app.mjs", "지우기"]
        expect_exit: 1
        expect_output: '사용법'
    review_card:
      front: "배열에서 꺼낸 객체를 바꾸면 배열 안의 것도 바뀌는가?"
      back: "바뀐다. 꺼낸 것은 복사본이 아니라 같은 객체를 가리키는 이름이다"
      answer_pattern: "바뀐|같|참조|예"
    explain:
      question: "add 에서 '넣은 제목'을 그대로 또 찍지 않고, 굳이 목록에서 다시 꺼내 보여 주게 한 이유는 무엇일까?"
      model_answer: |
        정말로 들어갔는지를 확인하기 위해서다. 넣은 값을 그대로 다시 찍으면 목록이 비어 있어도 똑같이
        보인다 — 화면만 맞고 실제 상태는 틀린 것을 못 잡는다. 목록에서 꺼내 찍으면 화면이 상태의
        증거가 된다. 프로그램을 만들 때도 검사를 만들 때도 같은 원리다. 주장을 믿지 말고 상태를 본다.
      keywords:
        - term: "확인"
          nudge: "넣은 값을 그대로 찍었을 때, 목록이 비어 있으면 화면이 어떻게 나올지 생각해 본다."
        - term: "상태"
          nudge: "화면에 보이는 것과 실제로 담긴 것을 갈라서 생각해 본다."
