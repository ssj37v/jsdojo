id: ch06
title: "6장 · 잘못된 입력을 막는다"
goal: "모듈이 스스로 입력을 검사해 실패를 알리고, 부르는 쪽이 그 실패를 사람 말로 옮긴다"
intro: |
  5장에서 만든 `lib/tasks.mjs` 에는 큰 구멍이 있다. 직접 불러 보면 드러난다.

    addTask(tasks, '')          → 제목이 빈 할 일이 그대로 들어간다
    addTask(tasks, '   ')       → 공백만 있는 할 일이 들어간다
    addTask(tasks, undefined)   → title 이 undefined 인 할 일이 들어간다

  지금은 `app.mjs` 가 `&& title` 로 막아 주고 있어서 겉으로는 문제가 없어 보인다.
  그런데 그 검사는 **모듈 밖** 에 있다. 다른 곳에서 `addTask` 를 부르는 순간 구멍이 열린다.
  검사가 부르는 쪽마다 흩어져 있으면, 한 곳만 빠뜨려도 목록이 더러워진다.

  **자기 입력은 자기가 검사한다.** 함수는 자기가 감당할 수 없는 입력을 받으면
  조용히 넘어가지 않고 **던져서** 알린다. 부르는 쪽은 그것을 받아 사람이 읽을 말로 옮긴다.

  이 장의 판정도 그만큼 엄격해진다. "던진다고 적었는가"가 아니라 **실제로 던지는가** 를 확인한다.

steps:
  - id: ch06-s01
    concept: throw-error
    kind: edit
    goal: "addTask 가 빈 제목을 거부하고 던진다"
    teach: |
      함수가 감당할 수 없는 입력을 받았을 때 할 수 있는 일은 셋이다.

        조용히 넘어간다        가장 나쁘다. 문제가 한참 뒤 엉뚱한 곳에서 터진다
        특별한 값을 돌려준다    부르는 쪽이 매번 확인해야 하고, 잊으면 그만이다
        던진다                 무시할 수 없다. 처리하지 않으면 프로그램이 멈춘다

      **막아야 할 잘못된 입력에는 던지는 쪽을 고른다.** 잊고 넘어갈 수 없기 때문이다.

        throw new Error('할 일 제목이 비어 있다')

      `throw` 를 만나면 함수는 그 자리에서 끝난다. 아래 줄들은 실행되지 않는다.
      그래서 검사는 **맨 앞** 에 둔다. 검사를 통과한 뒤에야 목록을 건드린다.

        export function addTask(tasks, title) {
          if (title === undefined || title.trim() === '') {
            throw new Error('할 일 제목이 비어 있다')
          }
          tasks.push({ title: title.trim(), done: false })
          return tasks[tasks.length - 1]
        }

      `title.trim()` 은 앞뒤 공백을 떼어 낸 문자열을 돌려준다. 원본은 그대로 둔다.
      공백만 있는 제목(`'   '`)을 걸러 내는 데 쓰고, 담을 때도 떼어 내고 담는다 —
      `' 장보기 '` 와 `'장보기'` 가 다른 할 일이 되면 곤란하기 때문이다.

      순서를 눈여겨본다. `title === undefined` 를 **먼저** 확인한다.
      `undefined.trim()` 은 그 자체로 터지므로, 그 전에 걸러야 한다.

      `app.mjs` 는 아직 고치지 않는다. 지금 `node app.mjs add` 를 치면 `&& title` 이 먼저 막아
      사용법이 나온다 — 그것을 걷어 내는 것이 다음 스텝이다.
    predict:
      question: "검사를 `tasks.push(...)` **뒤** 에 두면 무슨 일이 벌어질까?"
      answer_pattern: "들어|담기|추가|남|더럽|이미"
      reveal: |
        빈 할 일이 목록에 들어간 **뒤** 에 던지게 된다. 예외는 났는데 목록은 이미 더러워진 상태다.
        이런 어중간한 상태가 가장 고약하다 — 실패했다고 알렸으면 아무것도 바뀌지 않았어야 한다.
        그래서 검사는 상태를 건드리기 전에, 함수 맨 앞에 둔다.
    fade:
      copy: |
        export function addTask(tasks, title) {
          if (title === undefined || title.trim() === '') {
            throw new Error('할 일 제목이 비어 있다')
          }
          tasks.push({ title: title.trim(), done: false })
          return tasks[tasks.length - 1]
        }
      fill: |
        export function addTask(tasks, title) {
          if (title === undefined || title.____() === '') {
            ____ new Error('할 일 제목이 비어 있다')
          }
          tasks.push({ title: title.trim(), done: false })
          return tasks[tasks.length - 1]
        }
      recall: "addTask 가 비었거나 공백뿐인 제목을 목록에 담기 전에 거부하고, 담을 때는 앞뒤 공백을 떼어 담게 한다"
    hints:
      - "잘못된 입력을 조용히 받아들이면 문제가 한참 뒤에 엉뚱한 곳에서 드러난다. 그 자리에서 멈추게 해야 한다."
      - "addTask 맨 앞에 검사를 두고, 통과하지 못하면 던진다. 목록을 건드리는 것은 그 뒤다."
      - "if (title === undefined || title.trim() === '') { throw new Error('할 일 제목이 비어 있다') } 를 맨 앞에 두고, push 할 때 title.trim() 을 담는다."
    verify:
      - type: fs
        label: "lib/tasks.mjs 가 잘못된 입력에 던진다"
        path: "lib/tasks.mjs"
        matches: ['throw\s']
      - type: cmd
        label: "빈 제목·공백뿐인 제목·없는 제목을 모두 거부한다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const rejects = (title, what) => {
              try {
                addTask([], title)
              } catch (error) {
                assert.ok(error instanceof Error, `${what}: 던진 것이 Error 가 아니다`)
                return
              }
              assert.fail(`${what}: 막지 않고 통과시켰다`)
            }

            rejects('', '빈 문자열')
            rejects('   ', '공백뿐인 제목')
            rejects(undefined, '제목을 아예 주지 않은 경우')
      - type: cmd
        label: "거부했으면 목록에 아무것도 남지 않는다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = []
            try {
              addTask(tasks, '   ')
            } catch {
              // 여기서 잡는 것이 목적이 아니다. 목록 상태만 본다.
            }
            assert.equal(tasks.length, 0, '거부했는데 목록에 남았다 — 검사가 push 뒤에 있다')
      - type: cmd
        label: "제대로 된 제목은 앞뒤 공백을 떼고 담긴다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = []
            const added = addTask(tasks, ' 장보기 ')

            assert.equal(tasks.length, 1, '멀쩡한 제목까지 막으면 안 된다')
            assert.equal(tasks[0].title, '장보기', '앞뒤 공백은 떼고 담아야 한다')
            assert.equal(added, tasks[0], '넣은 그 항목을 돌려줘야 한다')

            addTask(tasks, '설거지')
            assert.equal(tasks.length, 2, '이어서 넣는 것도 그대로 되어야 한다')
    review_card:
      front: "잘못된 입력을 받은 함수가 '조용히 넘어가기'보다 '던지기'를 고르는 이유는?"
      back: "던진 것은 무시할 수 없다. 처리하지 않으면 프로그램이 멈춰서 문제가 그 자리에서 드러난다"
      answer_pattern: "무시|멈추|드러|바로|즉시"

  - id: ch06-s02
    concept: try-catch
    kind: edit
    goal: "app.mjs 가 던져진 실패를 받아 사람 말로 옮긴다"
    teach: |
      이제 `addTask` 가 스스로 막는다. 그러니 `app.mjs` 가 앞에서 대신 막아 줄 이유가 없다.
      `&& title` 을 **떼어 낸다.** 검사는 한 곳에만 있어야 한다.

      대신 던져진 것을 받아야 한다. 받을 때는 `try` / `catch` 를 쓴다.

        try {
          ...실패할 수 있는 일...
        } catch (error) {
          ...실패했을 때 할 일...
        }

      `try` 블록 안에서 던져지면 나머지를 건너뛰고 `catch` 로 간다.
      던져진 값은 괄호 안의 이름(`error`)으로 들어온다. `error.message` 에 그 문구가 있다.

        if (command === 'add') {
          try {
            const added = addTask(tasks, title)
            console.log(`추가: ${render(added)}`)
            printAll(tasks)
          } catch (error) {
            console.log(`추가하지 못했다: ${error.message}`)
            process.exit(1)
          }
        }

      `try` 안에 세 줄을 모두 넣은 것이 중요하다. `addTask` 가 던지면 그 아래 두 줄은
      아예 실행되지 않는다 — 실패했는데 "추가: " 가 찍히는 일이 없다.

      확인해 본다. 예전에는 사용법이 나오던 자리에서 이제 진짜 이유가 나온다.

        node app.mjs add           → 추가하지 못했다: 할 일 제목이 비어 있다
        node app.mjs add "   "     → 추가하지 못했다: 할 일 제목이 비어 있다
        node app.mjs add 장보기     → 그대로 추가된다
    fade:
      copy: |
        if (command === 'add') {
          try {
            const added = addTask(tasks, title)
            console.log(`추가: ${render(added)}`)
            printAll(tasks)
          } catch (error) {
            console.log(`추가하지 못했다: ${error.message}`)
            process.exit(1)
          }
        }
      fill: |
        if (command === 'add') {
          ____ {
            const added = addTask(tasks, title)
            console.log(`추가: ${render(added)}`)
            printAll(tasks)
          } ____ (error) {
            console.log(`추가하지 못했다: ${error.____}`)
            process.exit(1)
          }
        }
      recall: "add 가지에서 앞선 제목 검사를 걷어 내고, 모듈이 던진 실패를 받아 이유와 함께 실패로 끝내게 한다"
    hints:
      - "검사가 두 곳에 있으면 한 곳이 거짓말을 하게 된다. 모듈이 막기 시작했으니 앞의 검사는 필요 없다."
      - "add 가지 조건에서 제목 확인을 떼고, 본문 전체를 try 로 감싼 뒤 catch 에서 이유를 찍고 실패로 끝낸다."
      - "if (command === 'add') 로 바꾸고, try { ... } catch (error) { console.log(`추가하지 못했다: ${error.message}`); process.exit(1) } 로 감싼다."
    verify:
      - type: fs
        label: "app.mjs 가 실패를 받아 처리한다"
        path: "app.mjs"
        matches: ['try\s*\{', 'catch\s*\(']
      - type: cmd
        label: "제목 없이 add 하면 사용법이 아니라 진짜 이유가 나온다"
        run: ["node", "app.mjs", "add"]
        expect_exit: 1
        expect_output: '추가하지 못했다'
        reject_output: '사용법'
      - type: cmd
        label: "빈 제목도 같은 이유로 막힌다"
        run: ["node", "app.mjs", "add", ""]
        expect_exit: 1
        expect_output: '추가하지 못했다'
      - type: cmd
        label: "공백뿐인 제목도 막힌다"
        run: ["node", "app.mjs", "add", "   "]
        expect_exit: 1
        expect_output: '추가하지 못했다'
      - type: cmd
        label: "실패했으면 추가 메시지가 찍히지 않는다"
        run: ["node", "app.mjs", "add"]
        expect_exit: 1
        reject_output: '추가: '
      - type: cmd
        label: "멀쩡한 제목은 그대로 추가된다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '3\. \[ \] 장보기'
    review_card:
      front: "try 블록 안에서 던져지면 그 아래 줄들은 어떻게 되는가?"
      back: "실행되지 않는다. 곧바로 catch 로 넘어간다"
      answer_pattern: "실행.*않|건너|안 ?됨|catch"
    explain:
      question: "제목 검사를 app.mjs 와 lib/tasks.mjs 양쪽에 두면 무엇이 문제인가?"
      model_answer: |
        두 검사가 시간이 지나면서 어긋난다. 한쪽에만 조건을 추가하면 그때부터 '어느 쪽이 진짜 규칙인지'
        아무도 모르게 된다. 또 부르는 곳이 늘어날 때마다 검사를 복사해야 하고, 한 군데만 빠뜨려도
        구멍이 난다. 규칙은 그 규칙이 지켜져야 하는 곳 — 데이터를 실제로 건드리는 모듈 — 한 곳에만 둔다.
      keywords:
        - term: "어긋"
          nudge: "두 곳의 검사가 시간이 지나며 어떻게 될지 떠올려 본다."
        - term: "한 곳"
          nudge: "규칙이 여러 벌 있을 때와 한 벌만 있을 때의 차이를 짚어 본다."

  - id: ch06-s03
    concept: custom-error
    kind: edit
    goal: "실패에 이름을 붙여 종류를 구별할 수 있게 한다"
    teach: |
      지금 `catch` 는 **모든** 실패를 똑같이 다룬다. 오타 때문에 난 `ReferenceError` 도
      "추가하지 못했다: ..." 로 포장해서 종료 코드 1로 조용히 끝낸다.
      내가 예상한 실패와 예상 못 한 고장이 구별되지 않는 것이다. 이러면 진짜 버그가 숨는다.

      Error 에는 `name` 이 있다. 여기에 내 이름을 붙이면 종류를 구별할 수 있다.
      `workspace/lib/errors.mjs` 를 새로 만든다.

        export function invalidInput(message) {
          const error = new Error(message)
          error.name = 'InvalidInputError'
          return error
        }

      **만들어서 돌려주기만 한다.** 던지는 것은 부르는 쪽의 몫이다 —
      그래야 `throw` 가 실제로 코드에 보여서 흐름이 어디서 끊기는지 읽힌다.

      `lib/tasks.mjs` 가 이것을 쓰게 한다.

        import { invalidInput } from './errors.mjs'
        ...
        throw invalidInput('할 일 제목이 비어 있다')

      같은 폴더 안이므로 경로는 `'./errors.mjs'` 다.

      그리고 `app.mjs` 의 `catch` 가 종류를 가린다.

        } catch (error) {
          if (error.name !== 'InvalidInputError') {
            throw error
          }
          console.log(`추가하지 못했다: ${error.message}`)
          process.exit(1)
        }

      **모르는 실패는 다시 던진다.** 이것이 이 스텝의 핵심이다.
      내가 아는 실패만 사람 말로 옮기고, 나머지는 손대지 않고 그대로 올려보낸다.
      그래야 예상 못 한 고장이 스택 트레이스와 함께 드러나서 고칠 수 있다.
      `!==` 는 '같지 않은가'를 묻는 비교다.
    fade:
      copy: |
        export function invalidInput(message) {
          const error = new Error(message)
          error.name = 'InvalidInputError'
          return error
        }
      fill: |
        export function invalidInput(message) {
          const error = new Error(message)
          error.____ = 'InvalidInputError'
          ____ error
        }
      recall: "lib/errors.mjs 를 만들어 이름 붙은 실패를 만드는 함수를 내보내고, tasks 가 그것을 던지고 app 이 그 이름만 골라 처리하게 한다"
    hints:
      - "지금은 내가 예상한 실패와 예상 못 한 고장이 화면에서 똑같아 보인다. 둘을 가를 표식이 필요하다."
      - "lib/errors.mjs 에서 Error 를 만들어 name 을 붙여 돌려주고, tasks 는 그것을 던지고, app 의 catch 는 name 이 다르면 다시 던진다."
      - "export function invalidInput(message) { const error = new Error(message); error.name = 'InvalidInputError'; return error } 를 만들고, throw invalidInput(...) 로 바꾸고, catch 에서 if (error.name !== 'InvalidInputError') { throw error } 를 맨 앞에 둔다."
    verify:
      - type: fs
        label: "lib/errors.mjs 가 이름 붙은 실패를 만든다"
        path: "lib/errors.mjs"
        matches: ['InvalidInputError']
      - type: fs
        label: "app.mjs 는 모르는 실패를 삼키지 않고 다시 던진다"
        path: "app.mjs"
        matches: ['throw\s+error']
      - type: cmd
        label: "addTask 가 던지는 실패는 이름으로 구별된다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            try {
              addTask([], '   ')
            } catch (error) {
              assert.ok(error instanceof Error, '던진 것이 Error 여야 한다')
              assert.equal(
                error.name,
                'InvalidInputError',
                `실패 종류를 이름으로 구별할 수 있어야 한다 (받은 이름: ${error.name})`,
              )
              assert.ok(error.message.length > 0, '무엇이 잘못됐는지 메시지가 있어야 한다')
              process.exit(0)
            }
            assert.fail('공백뿐인 제목을 막지 않았다')
      - type: cmd
        label: "errors 모듈은 실패를 만들어 돌려줄 뿐 던지지 않는다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { invalidInput } from './lib/errors.mjs'
            import assert from 'node:assert/strict'

            const error = invalidInput('무언가 잘못됐다')

            assert.ok(error instanceof Error, 'Error 를 만들어 돌려줘야 한다')
            assert.equal(error.name, 'InvalidInputError', '이름이 붙어 있어야 한다')
            assert.equal(error.message, '무언가 잘못됐다', '받은 문구가 그대로 담겨야 한다')
      - type: cmd
        label: "CLI 는 여전히 이유를 사람 말로 알린다"
        run: ["node", "app.mjs", "add"]
        expect_exit: 1
        expect_output: '추가하지 못했다'
    review_card:
      front: "catch 에서 내가 모르는 실패를 만나면 무엇을 해야 하나?"
      back: "다시 던진다(throw error). 삼키면 진짜 버그가 숨는다"
      answer_pattern: "던|throw|올려|다시"

  - id: ch06-s04
    concept: guard-clause
    kind: edit
    goal: "모든 공개 함수가 입구에서 인자를 걸러 내게 한다"
    teach: |
      `addTask` 만 자기를 지키고 있다. 나머지는 아직 무방비다.

        completeTask(null, '우유 사기')   → TypeError. 무슨 일인지 알 수 없는 메시지가 뜬다
        completeTask(tasks, '')           → 빈 제목으로 목록을 뒤진다
        countPending('배열이 아님')        → TypeError

      **가드 절(guard clause)** 은 함수 맨 앞에서 잘못된 경우를 걸러 내고 곧바로 빠져나가는 방식이다.
      본문에는 정상 경로만 남는다. 조건을 감싸 들어가는 대신, 아닌 것부터 쳐낸다.

      두 검사가 여러 함수에서 반복되므로 도우미로 뽑는다. **둘 다 내보내지 않는다** — 내부 사정이다.

        function requireList(tasks) {
          if (Array.isArray(tasks) === false) {
            throw invalidInput('할 일 목록이 배열이 아니다')
          }
          return tasks
        }

        function requireTitle(title) {
          if (typeof title !== 'string' || title.trim() === '') {
            throw invalidInput('할 일 제목이 비어 있다')
          }
          return title.trim()
        }

      `Array.isArray(값)` 은 배열인지 알려 준다. `typeof 값` 은 값의 종류를 문자열로 돌려준다 —
      문자열이면 `'string'` 이다. 이렇게 하면 숫자나 `null` 을 제목으로 준 경우까지 한 번에 막힌다.

      `requireTitle` 이 **다듬은 제목을 돌려주는** 것이 요령이다. 검사와 정리를 한 번에 끝내서
      부르는 쪽이 `trim()` 을 다시 신경 쓰지 않아도 된다.

        export function addTask(tasks, title) {
          requireList(tasks)
          const clean = requireTitle(title)
          tasks.push({ title: clean, done: false })
          return tasks[tasks.length - 1]
        }

        export function completeTask(tasks, title) {
          requireList(tasks)
          const clean = requireTitle(title)
          const target = tasks.find((task) => task.title === clean)
          if (target) {
            target.done = true
          }
          return target
        }

        export function countPending(tasks) {
          requireList(tasks)
          return tasks.filter(isPending).length
        }

      `completeTask` 는 여전히 **못 찾으면 `undefined`** 를 돌려준다. 이것은 잘못된 입력이 아니라
      정상적인 결과 중 하나이기 때문이다 — 5장에서 정한 그대로 둔다.
      **막아야 할 것은 '틀린 입력'이지 '원하는 답이 없는 것'이 아니다.** 이 둘을 섞지 않는다.
    predict:
      question: "`completeTask(tasks, '없는 제목')` 은 던져야 할까, `undefined` 를 돌려줘야 할까?"
      answer_pattern: "undefined|돌려|안 ?던|아니"
      reveal: |
        `undefined` 를 돌려준다. 제목은 멀쩡한 문자열이고, 그저 목록에 없을 뿐이다.
        '찾지 못함'은 정상적인 결과다 — 검색이란 원래 못 찾을 수 있다.
        반면 `null` 을 목록으로 넘기거나 빈 제목을 주는 것은 부르는 쪽의 실수다. 그건 던진다.
        이 선을 흐리면 정상적인 흐름에까지 try/catch 가 번져 코드가 읽히지 않게 된다.
    fade:
      copy: |
        function requireTitle(title) {
          if (typeof title !== 'string' || title.trim() === '') {
            throw invalidInput('할 일 제목이 비어 있다')
          }
          return title.trim()
        }

        export function countPending(tasks) {
          requireList(tasks)
          return tasks.filter(isPending).length
        }
      fill: |
        function requireTitle(title) {
          if (____ title !== 'string' || title.trim() === '') {
            throw invalidInput('할 일 제목이 비어 있다')
          }
          ____ title.trim()
        }

        export function countPending(tasks) {
          ____(tasks)
          return tasks.filter(isPending).length
        }
      recall: "목록과 제목을 검사하는 도우미를 내보내지 않고 두고, 공개 함수 셋이 모두 입구에서 그것을 거치게 한다"
    hints:
      - "addTask 만 자기를 지키고 있다. 같은 검사를 세 함수가 나눠 갖되 코드는 한 벌이어야 한다."
      - "검사 두 개를 export 없이 함수로 뽑고, 공개 함수마다 첫 줄에서 부른다. 제목 검사는 다듬은 값을 돌려주게 한다."
      - "function requireList(tasks) 와 function requireTitle(title) 을 export 없이 만들고, addTask·completeTask 는 둘 다, countPending 은 requireList 를 맨 앞에서 부른다."
    verify:
      - type: cmd
        label: "목록 자리에 배열이 아닌 것을 주면 세 함수 모두 막는다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask, completeTask, countPending } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const rejects = (fn, what) => {
              try {
                fn()
              } catch (error) {
                assert.equal(
                  error.name,
                  'InvalidInputError',
                  `${what}: 내가 만든 실패로 막아야 한다 (받은 이름: ${error.name})`,
                )
                return
              }
              assert.fail(`${what}: 막지 않고 통과시켰다`)
            }

            rejects(() => addTask(null, '장보기'), 'addTask 에 null 목록')
            rejects(() => completeTask(null, '장보기'), 'completeTask 에 null 목록')
            rejects(() => countPending('배열이 아님'), 'countPending 에 문자열')
      - type: cmd
        label: "제목 자리에 문자열이 아닌 것·빈 것을 주면 막는다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask, completeTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const rejects = (fn, what) => {
              try {
                fn()
              } catch (error) {
                assert.equal(
                  error.name,
                  'InvalidInputError',
                  `${what}: 내가 만든 실패로 막아야 한다 (받은 이름: ${error.name})`,
                )
                return
              }
              assert.fail(`${what}: 막지 않고 통과시켰다`)
            }

            rejects(() => addTask([], 123), '숫자 제목')
            rejects(() => addTask([], null), 'null 제목')
            rejects(() => completeTask([], ''), 'completeTask 에 빈 제목')
            rejects(() => completeTask([], '   '), 'completeTask 에 공백뿐인 제목')
      - type: cmd
        label: "찾지 못한 것은 실패가 아니다 — undefined 를 돌려준다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { completeTask } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = [{ title: '우유 사기', done: false }]
            const target = completeTask(tasks, '세차하기')

            assert.equal(target, undefined, '없는 제목은 던지지 말고 undefined 를 돌려준다')
            assert.equal(tasks[0].done, false, '못 찾았는데 엉뚱한 것을 건드리면 안 된다')
      - type: cmd
        label: "정상 경로는 그대로 동작한다"
        run:
          - node
          - --input-type=module
          - -e
          - |
            import { addTask, completeTask, countPending } from './lib/tasks.mjs'
            import assert from 'node:assert/strict'

            const tasks = []
            addTask(tasks, ' 장보기 ')
            addTask(tasks, '설거지')

            assert.deepEqual(tasks.map((task) => task.title), ['장보기', '설거지'])
            assert.equal(countPending(tasks), 2, '아직 둘 다 안 끝났다')

            const target = completeTask(tasks, ' 장보기 ')
            assert.equal(target, tasks[0], '다듬은 제목으로도 찾아져야 한다')
            assert.equal(countPending(tasks), 1, '하나 끝냈으면 하나 남는다')
      - type: cmd
        label: "CLI 는 그대로 동작한다"
        run: ["node", "app.mjs", "list"]
        expect_output: '할 일 2개 \(남은 것 1개\)'
    review_card:
      front: "'틀린 입력'과 '찾는 것이 없음'은 어떻게 다르게 다루는가?"
      back: "틀린 입력은 던진다. 찾는 것이 없는 것은 정상 결과이므로 undefined 를 돌려준다"
      answer_pattern: "던|throw|undefined|정상"

  - id: ch06-s05
    concept: safe-cli
    kind: edit
    boss: true
    goal: "어떤 입력에도 스택 트레이스를 보이지 않는 CLI를 완성한다"
    teach: |
      마무리다. 힌트는 없다.

      지금 `done` 가지는 아직 `&& title` 로 막고 있어서, 제목 없이 `done` 을 치면
      "그런 할 일이 없다"도 "제목이 비어 있다"도 아닌 **사용법** 이 나온다. 이유를 알려 주지 않는 것이다.

      세 명령 모두가 실패를 제대로 옮기게 한다. 목표는 하나로 요약된다 —
      **어떤 입력을 주어도 사용자가 스택 트레이스를 보지 않는다.** 대신 무엇이 잘못됐는지 읽는다.

        node app.mjs add                → 추가하지 못했다: 할 일 제목이 비어 있다   (종료 1)
        node app.mjs done               → 완료하지 못했다: 할 일 제목이 비어 있다   (종료 1)
        node app.mjs done ""            → 완료하지 못했다: 할 일 제목이 비어 있다   (종료 1)
        node app.mjs done 세차하기       → 그런 할 일이 없다: 세차하기              (종료 1)
        node app.mjs done 빨래 개기      → 완료: [x] 빨래 개기 + 목록
        node app.mjs add 장보기          → 추가: [ ] 장보기 + 목록
        node app.mjs list               → 할 일 2개 (남은 것 1개) + 목록
        node app.mjs                    → 사용법                                  (종료 1)

      요구사항은 넷이다.

        1. done 가지에서도 `&& title` 을 떼고, 본문을 try 로 감싼다.
           실패하면 `완료하지 못했다: <이유>` 를 찍고 종료 코드 1로 끝낸다
        2. '찾지 못함'은 예외가 아니다. completeTask 가 undefined 를 돌려준 경우는
           지금처럼 `그런 할 일이 없다: <제목>` 으로 알린다
        3. 모르는 실패는 어느 가지에서도 삼키지 않는다 — 이름이 다르면 다시 던진다
        4. 두 catch 가 같은 일을 하므로, 접두어만 다른 도우미 함수 하나로 묶는다

      4번이 이 스텝의 진짜 과제다. `catch` 블록 두 개를 복사해 붙이면 그 둘은 언젠가 어긋난다.
      2장에서 배운 그대로 — 같은 일을 두 번 적고 있다면 함수로 묶을 때가 된 것이다.
    verify:
      - type: cmd
        label: "제목 없이 done 하면 사용법이 아니라 진짜 이유가 나온다"
        run: ["node", "app.mjs", "done"]
        expect_exit: 1
        expect_output: '완료하지 못했다'
        reject_output: '사용법'
      - type: cmd
        label: "빈 제목으로 done 해도 이유가 나온다"
        run: ["node", "app.mjs", "done", ""]
        expect_exit: 1
        expect_output: '완료하지 못했다'
      - type: cmd
        label: "찾지 못한 것은 '없다'로 알린다 — 예외로 다루지 않는다"
        run: ["node", "app.mjs", "done", "세차하기"]
        expect_exit: 1
        expect_output: '그런 할 일이 없다'
        reject_output: '완료하지 못했다'
      - type: cmd
        label: "실패해도 스택 트레이스를 보이지 않는다"
        run: ["node", "app.mjs", "done"]
        expect_exit: 1
        reject_output: '^\s+at\s'
      - type: cmd
        label: "add 실패에서도 스택 트레이스를 보이지 않는다"
        run: ["node", "app.mjs", "add"]
        expect_exit: 1
        expect_output: '추가하지 못했다'
        reject_output: '^\s+at\s'
      - type: cmd
        label: "done 은 지목한 것만 완료하고 바뀐 목록을 보여 준다"
        run: ["node", "app.mjs", "done", "빨래 개기"]
        expect_output: '1\. \[ \] 우유 사기[\s\S]*2\. \[x\] 빨래 개기'
      - type: cmd
        label: "add 는 넣은 뒤의 전체 목록을 보여 준다"
        run: ["node", "app.mjs", "add", "장보기"]
        expect_output: '3\. \[ \] 장보기'
      - type: cmd
        label: "다른 제목을 줘도 그것이 목록에 들어간다"
        run: ["node", "app.mjs", "add", "설거지"]
        expect_output: '3\. \[ \] 설거지'
        reject_output: '장보기'
      - type: cmd
        label: "list 는 남은 개수를 함께 알린다"
        run: ["node", "app.mjs", "list"]
        expect_output: '할 일 2개 \(남은 것 1개\)'
      - type: cmd
        label: "명령이 없으면 사용법을 알리고 실패로 끝낸다"
        run: ["node", "app.mjs"]
        expect_exit: 1
        expect_output: '사용법'
    review_card:
      front: "사용자가 스택 트레이스를 보게 되는 것은 무엇을 뜻하는가?"
      back: "내가 예상하지 못한 실패가 났다는 뜻이다. 예상한 실패라면 사람 말로 옮겨져 있어야 한다"
      answer_pattern: "예상|모르|버그|처리.*않"
    explain:
      question: "모르는 실패까지 catch 로 잡아 '추가하지 못했다' 로 바꿔 버리면 무엇이 나빠지나?"
      model_answer: |
        진짜 버그가 사용자 실수처럼 보이게 된다. 오타로 난 ReferenceError 도 "제목을 확인하세요" 같은
        메시지로 포장되면, 사용자는 자기 입력을 고치느라 시간을 버리고 개발자는 문제가 있다는 사실조차
        모른다. 종료 코드까지 1로 같으니 자동화도 구별하지 못한다.
        내가 예상하고 처리하기로 한 실패만 옮기고, 나머지는 그대로 드러나게 두어야 고칠 기회가 생긴다.
      keywords:
        - term: "버그"
          nudge: "예상 못 한 고장이 사용자 실수처럼 보이면 누가 무엇을 놓치는지 생각해 본다."
        - term: "숨"
          nudge: "삼켜진 오류가 어디로 가는지 떠올려 본다."
